name: Promise Breach Hourly Sweep

on:
  push:
    branches: [main]
    paths: ['.github/workflows/promise-breach-hourly-sweep.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST" && test -n "$HOSTINGER_USER" && test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Reconcile overdue promises
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/promise_hourly_sweep.php <<'PHP'
          <?php
          date_default_timezone_set("America/Caracas");
          require "promise_restrictions_lib.php";
          require "config_wisphub.php";
          
          function wh_get_json(string $url): ?array {
            $ch=curl_init($url);
            curl_setopt_array($ch,[
              CURLOPT_RETURNTRANSFER=>true,
              CURLOPT_HTTPHEADER=>["Authorization: Api-Key ".WISPHUB_TOKEN,"Accept: application/json"],
              CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>20,
              CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2
            ]);
            $body=curl_exec($ch);$code=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);curl_close($ch);
            if($body===false||$code<200||$code>=300)return null;
            $d=json_decode($body,true);
            return is_array($d)?$d:null;
          }
          
          function pending_invoice_ids(array $saldo): array {
            $out=[];
            $items=is_array($saldo["facturas"]??null)?$saldo["facturas"]:[];
            foreach($items as $invoice){
              if(!is_array($invoice))continue;
              $id=trim((string)pr_first_value($invoice,["id_factura","id"],""));
              if($id!=="")$out[$id]=true;
            }
            return $out;
          }
          
          $today=(new DateTimeImmutable("now",new DateTimeZone("America/Caracas")))->format("Y-m-d");
          $ledger=pr_load_promise_ledger();
          $checked=0;$breached=0;$fulfilled=0;$errors=0;
          $saldoCache=[];
          
          foreach($ledger as $entry){
            if(!is_array($entry)||!empty($entry["fulfilled_at"])||!empty($entry["breached_at"]))continue;
            $deadline=trim((string)($entry["deadline"]??""));
            if($deadline===""||$deadline>=$today)continue;
            $serviceId=trim((string)($entry["service_id"]??""));
            $invoiceId=trim((string)($entry["invoice_id"]??""));
            $ledgerKey=trim((string)($entry["ledger_key"]??""));
            if($serviceId===""||$invoiceId===""||$ledgerKey===""){$errors++;continue;}
            $checked++;
          
            if(!array_key_exists($serviceId,$saldoCache)){
              $saldoCache[$serviceId]=wh_get_json(rtrim(WISPHUB_API_URL,"/")."/clientes/".rawurlencode($serviceId)."/saldo/");
            }
            $saldo=$saldoCache[$serviceId];
            if(!is_array($saldo)){$errors++;continue;}
          
            $pending=pending_invoice_ids($saldo);
            if(!isset($pending[$invoiceId])){
              if(pr_update_promise_ledger_entry($ledgerKey,["fulfilled_at"=>date(DATE_ATOM),"resolution"=>"invoice_not_pending_after_hourly_sweep"]))$fulfilled++;else $errors++;
              continue;
            }
          
            $deadlineDate=DateTimeImmutable::createFromFormat("!Y-m-d",$deadline,new DateTimeZone("America/Caracas"));
            if(!$deadlineDate){$errors++;continue;}
            $incidentDate=$deadlineDate->modify("+1 day");
            $client=[
              "nombre"=>trim((string)($entry["client_name"]??"Cliente")),
              "id_servicio"=>$serviceId,
              "id_cliente"=>trim((string)($entry["client_id"]??"")),
              "usuario"=>pr_normalize_username($entry["username"]??""),
              "telefono"=>pr_normalize_phone($entry["phone"]??""),
              "cedula"=>trim((string)($entry["cedula"]??"")),
              "correo"=>trim((string)($entry["email"]??""))
            ];
            $restriction=pr_create_restriction_record($client,$incidentDate,"promise-ledger-hourly-sweep","Restricción automática: factura pendiente después de la fecha prometida.","system-hourly-sweep");
            if(!$restriction){$errors++;continue;}
            if(!pr_update_promise_ledger_entry($ledgerKey,["breached_at"=>date(DATE_ATOM),"restriction_id"=>$restriction["id"]??null,"resolution"=>"invoice_still_pending_after_hourly_sweep"])){$errors++;continue;}
            $breached++;
          }
          echo "SUMMARY checked=$checked breached=$breached fulfilled=$fulfilled errors=$errors\n";
          if($errors>0) exit(2);
          
          PHP
          scp -i ~/.ssh/hostinger -P 65002 /tmp/promise_hourly_sweep.php "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/promise_hourly_sweep.php"
          ssh -i ~/.ssh/hostinger -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'cd "$HOME/domains/wifirapidito.com/public_html" && php /tmp/promise_hourly_sweep.php'
