name: Rapidito Meta Delivery Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rapidito-meta-delivery-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VPS SSH
        env:
          VPS_HOST: ${{ secrets.BOT_VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
          VPS_PORT_RAW: ${{ secrets.BOT_VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_SSH_KEY_B64"
          PORT="$(printf '%s' "$VPS_PORT_RAW" | tr -d '[:space:]')"
          if ! [[ "$PORT" =~ ^[0-9]{1,5}$ ]] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then PORT=22; fi
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/rapidito_vps
          chmod 600 ~/.ssh/rapidito_vps
          ssh-keygen -y -f ~/.ssh/rapidito_vps >/dev/null
          ssh-keyscan -T 10 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
      - name: Examine inbound delivery and Meta app subscriptions read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rapidito_vps -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "root@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "AUDIT_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          target="$(docker ps --filter publish=5000 --format '{{.Names}}' | head -n 1)"
          echo "ACTIVE_LISTENER=$target"
          echo '---META APP SUBSCRIPTIONS (NO CREDENTIALS)---'
          docker exec "$target" python - <<'PY' || true
          PY
          docker exec "$target" python -c '
          import os,httpx
          from urllib.parse import urlsplit
          token=os.getenv("META_ACCESS_TOKEN","")
          phone=os.getenv("META_PHONE_NUMBER_ID","")
          version=os.getenv("META_GRAPH_VERSION","v25.0")
          print("META_CREDENTIALS_PRESENT=",bool(token and phone))
          if not (token and phone): raise SystemExit(0)
          client=httpx.Client(timeout=12)
          base="https://graph.facebook.com/"+version+"/"
          headers={"Authorization":"Bearer "+token}
          def query(path,params=None):
              try:
                  r=client.get(base+path,headers=headers,params=params)
                  if r.status_code>=400:
                      err=r.json().get("error",{})
                      print("GRAPH_QUERY_ERROR=",r.status_code,"code=",err.get("code"),"subcode=",err.get("error_subcode"))
                      return None
                  return r.json()
              except Exception as e:
                  print("GRAPH_TRANSPORT_ERROR=",type(e).__name__)
                  return None
          obj=query(phone,{"fields":"whatsapp_business_account"})
          waba=((obj or {}).get("whatsapp_business_account") or {}).get("id")
          print("PHONE_WABA_LOOKUP=",bool(waba))
          if waba:
              subscriptions=query(waba+"/subscribed_apps",{"fields":"id,name,override_callback_uri"})
              apps=(subscriptions or {}).get("data",[])
              print("WABA_SUBSCRIBED_APP_COUNT=",len(apps))
              for item in apps[:12]:
                  uri=item.get("override_callback_uri") or ""
                  p=urlsplit(uri)
                  print("WABA_APP_NAME=",str(item.get("name",""))[:70],"OVERRIDE_CALLBACK_HOST=",p.hostname or "none","OVERRIDE_CALLBACK_PATH=",p.path or "none")
          app_id=os.getenv("META_APP_ID") or os.getenv("FACEBOOK_APP_ID") or ""
          print("APP_ID_ENV_PRESENT=",bool(app_id))
          if app_id:
              app_subs=query(app_id+"/subscriptions")
              for s in (app_subs or {}).get("data",[]):
                  if s.get("object")=="whatsapp_business_account":
                      u=urlsplit(s.get("callback_url",""))
                      print("APP_CALLBACK_HOST=",u.hostname or "none","APP_CALLBACK_PATH=",u.path or "none","APP_FIELDS=",",".join(s.get("fields",[])[:20]))
          ' 2>&1 | tail -n 35
          echo '---RECENT INBOUND FROM DOCKER---'
          docker logs --timestamps --since 8h --tail 25000 "$target" 2>&1 | awk '
          /POST \/webhook/ {total++; last=substr($0,1,30)}
          END {print "EIGHT_HOUR_WEBHOOK_COUNT=",total+0,"LAST_WEBHOOK_UTC=",last}'
          echo '---RECENT PUBLIC HTTPS ACCESS COUNTS---'
          f=/home/webhook.wifirapidito.com/logs/webhook.wifirapidito.com.access_log
          if [ -r "$f" ]; then
            tail -n 15000 "$f" | awk '
            /webhook/ {total++; last=substr($0,1,145)}
            END {print "RECENT_WEBHOOK_ACCESS_COUNT=",total+0; if(last!="") print "LAST_ACCESS_LINE_REDACTED=present"}'
          else echo 'WEBHOOK_ACCESS_LOG_UNAVAILABLE=1'; fi
          echo '---TIMELINE OF WEBHOOKS AND META SENDS, NO PHONE NUMBERS---'
          docker logs --timestamps --since 3h --tail 8000 "$target" 2>&1 | awk '
            /POST \/webhook/ {print substr($0,1,30),"INBOUND_WEBHOOK"}
            /HTTP Request: POST https:\/\/graph.facebook.com\// {
              status="UNKNOWN"
              if ($0 ~ /200 OK/) status="SUCCESS_200"
              else if ($0 ~ /400|401|403|429|500/) status="HTTP_ERROR"
              print substr($0,1,30),"OUTBOUND_META",status
            }' | tail -n 45
          echo '---LIVE BOT ROUTER FUNCTIONS---'
          docker exec "$target" python -c '
          import ast,pathlib
          for name in ("bot_presentation.py","bot_entry.py","bot_logic.py"):
              p=pathlib.Path("/app")/name
              if not p.exists():
                  print("MISSING=",name)
                  continue
              t=ast.parse(p.read_text())
              print("FILE=",name,"LINES=",len(p.read_text().splitlines()))
              for node in t.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                      print("FUNCTION=",node.name,"START=",node.lineno,"END=",node.end_lineno)
              imports=[]
              for n in t.body:
                  if isinstance(n,ast.ImportFrom):
                      imports.append(n.module or "")
              print("IMPORT_MODULES=",",".join(imports[:20]))
          ' 2>&1 | tail -n 100
          echo '---LIVE BOT META CONFIG KEY PRESENCE---'
          docker exec "$target" python -c '
          import os
          print("META_RELATED_KEY_NAMES=",",".join(sorted(k for k in os.environ if any(t in k for t in ("META_","WABA","WEBHOOK","FACEBOOK_")))))
          ' 2>&1 | tail -n 3
          echo '---ACTIVE BOT MESSAGE ROUTING SOURCE (NO SECRETS)---'
          docker exec "$target" python -c '
          from pathlib import Path
          p=Path("/app/bot_logic.py"); s=p.read_text().splitlines()
          for start,end in ((106,112),(482,511),(914,978),(981,991),(995,1039)):
              print("SNIPPET=",start,"-",end)
              for i in range(start,end+1):
                  x=s[i-1]
                  print(str(i)+": "+x)
          ' 2>&1 | tail -n 225
          echo '---META WABA SUBSCRIPTIONS---'
          docker exec "$target" python -c '
          import os,httpx
          from urllib.parse import urlsplit
          t=os.getenv("META_ACCESS_TOKEN","")
          w=os.getenv("META_WABA_ID","")
          v=os.getenv("META_GRAPH_VERSION","v25.0")
          print("HAS_WABA_ID=",bool(w))
          if w and t:
              try:
                  r=httpx.get("https://graph.facebook.com/"+v+"/"+w+"/subscribed_apps",headers={"Authorization":"Bearer "+t},timeout=12)
                  print("SUBSCRIBED_APPS_HTTP=",r.status_code)
                  d=r.json()
                  if r.status_code==200:
                      apps=d.get("data",[])
                      print("SUBSCRIBED_APPS_COUNT=",len(apps))
                      for a in apps[:8]:
                          u=urlsplit(a.get("override_callback_uri") or "")
                          print("APP_NAME=",str(a.get("name",""))[:40],"OVERRIDE_HOST=",u.hostname or "none","OVERRIDE_PATH=",u.path or "none")
                  else: print("SUBSCRIPTION_ERROR_CODE=",d.get("error",{}).get("code"))
              except Exception as e: print("SUBSCRIPTION_QUERY_ERROR=",type(e).__name__)
          ' 2>&1 | tail -n 20
          echo '---ANONYMIZED DELIVERY TELEMETRY AFTER INSTRUMENTATION---'
          docker logs --timestamps --since 20m --tail 12000 "$target" 2>&1 | grep -E 'RAPIDITO_META_(SEND_ACCEPTED|STATUS|INBOUND)' | tail -n 35 || true
          echo '---LIVE PUBLIC WEBHOOK HEALTH---'
          curl -fsS -m 10 https://webhook.wifirapidito.com/webhook | python3 -c 'import json,sys; d=json.load(sys.stdin); print("public_status=",d.get("status"),"provider=",d.get("provider"))' || true
          echo '---7:28 RAPIDITO TEST - DELIVERY TELEMETRY---'
          docker logs --timestamps --since 35m --tail 25000 "$target" 2>&1 | grep -E 'RAPIDITO_META_(SEND_ACCEPTED|STATUS|INBOUND)' | tail -n 90 || true
          echo '---7:28 RAPIDITO TEST - WEBHOOK AND SEND TIMES---'
          docker logs --timestamps --since 35m --tail 25000 "$target" 2>&1 | awk '
              /POST \/webhook/ {print substr($0,1,30),"WEBHOOK",($0 ~ /200 OK/ ? "200" : "non-200")}
              /HTTP Request: POST https:\/\/graph.facebook.com\// {print substr($0,1,30),"META_SEND",($0 ~ /200 OK/ ? "200" : "non-200")}
              /Error enviando WhatsApp|Meta WhatsApp no está|Traceback/ {print substr($0,1,30),"ERROR"}
          ' | tail -n 100
          echo '---CURRENT TIME---'
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          echo '---DONE---'
          REMOTE
