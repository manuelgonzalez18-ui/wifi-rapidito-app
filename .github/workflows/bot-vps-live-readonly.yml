name: Bot VPS Live Readonly

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-vps-live-readonly.yml'
      - 'vps/LIVE_READONLY_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_HOST: 76.13.100.2
      SSH_PORT: '22'
      TARGET_USER: root
      EXPECTED_HOST_FP: SHA256:bO3AdnzChlN7ZSaozrNfs3C0wLT6cvMyI4Jg1D78qYQ
      APP: /home/bot.local/public_html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure verified VPS SSH
        env:
          BOT_VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_VPS_SSH_KEY_B64"
          mkdir -p ~/.ssh
          printf '%s' "$BOT_VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
          ssh-keyscan -T 5 -t ed25519 -p "$SSH_PORT" "$TARGET_HOST" > ~/.ssh/known_hosts 2>/dev/null
          actual_fp=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | head -1)
          test "$actual_fp" = "$EXPECTED_HOST_FP"
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" 'echo VPS_CONNECTION_OK'

      - name: Inspect active bot and payment flow without changes
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" "APP='$APP' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP"
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"

          for c in bot_backend evolution_api redis_bot; do
            running=$(docker inspect -f '{{.State.Running}}' "$c")
            image=$(docker inspect -f '{{.Config.Image}}' "$c")
            echo "CONTAINER=$c RUNNING=$running IMAGE=$image"
            test "$running" = true
          done

          health=$(curl -fsS --max-time 8 http://127.0.0.1:5000/webhook)
          printf '%s\n' "$health"
          grep -q '"status":"ok"' <<<"$health"
          grep -q '4.0-bot-10-opciones' <<<"$health"
          echo 'BOT_HEALTH_OK=1'

          docker exec bot_backend python -m py_compile /app/bot_logic.py /app/bot_entry.py
          docker exec bot_backend grep -Fq 'PAYMENT_PROXY_URL' /app/bot_logic.py
          docker exec bot_backend grep -Fq 'response = await client.post(PAYMENT_PROXY_URL, data=form)' /app/bot_logic.py
          docker exec bot_backend grep -Fq 'ok, result = await bot.register_verified_payment' /app/bot_entry.py
          docker exec bot_backend grep -Fq 'await record_payment_audit' /app/bot_entry.py
          docker exec bot_backend grep -Fq '"source": "whatsapp_bot"' /app/bot_entry.py
          docker exec bot_backend grep -Fq 'https://wifirapidito.com/payment_audit.php' /app/bot_entry.py
          echo 'ACTIVE_PAYMENT_FLOW_CODE_OK=1'

          proxy_health=$(curl -fsS --max-time 12 'https://wifirapidito.com/proxy_payments.php?health=vps-readonly')
          printf '%s\n' "$proxy_health"
          grep -q '4.2-wisphub-datetime-errors' <<<"$proxy_health"
          echo 'PAYMENT_PROXY_PUBLIC_OK=1'

          audit_code=$(curl -sS --max-time 12 -o /tmp/payment_audit_get.txt -w '%{http_code}' 'https://wifirapidito.com/payment_audit.php?health=vps-readonly' || true)
          echo "PAYMENT_AUDIT_GET_HTTP=$audit_code"

          docker exec bot_backend sh -lc 'test -n "$WISPHUB_API_KEY" && echo WISPHUB_API_KEY=SET || echo WISPHUB_API_KEY=MISSING'
          docker exec bot_backend sh -lc 'if test -n "$META_ACCESS_TOKEN"; then echo WHATSAPP_PROVIDER_META=CONFIGURED; elif test -n "$EVO_API_KEY"; then echo WHATSAPP_PROVIDER_EVOLUTION=CONFIGURED; else echo WHATSAPP_PROVIDER=MISSING; fi'

          echo 'READONLY_INSPECTION_COMPLETE=1'
          REMOTE
