name: Payment Active Config Diagnostics

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/payment-active-config-diagnostics.yml'

permissions:
  contents: read

jobs:
  deploy-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate payment history endpoint
        shell: bash
        run: |
          set -euo pipefail
          php -l public/payment_audit.php
          grep -q '2.0-payment-registry-30d' public/payment_audit.php
          grep -q "payment_registry_history" public/payment_audit.php

      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy >/dev/null
          ssh-keyscan -T 10 -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy only payment history endpoint
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="domains/wifirapidito.com/public_html"
          TMP_NAME="payment_audit.php.tmp.${GITHUB_SHA}"

          scp -i ~/.ssh/hostinger_deploy -P 65002 public/payment_audit.php \
            "$HOSTINGER_USER@$HOSTINGER_HOST:~/$REMOTE_BASE/$TMP_NAME"

          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "SHA='$GITHUB_SHA' TMP_NAME='$TMP_NAME' bash -s" <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domains/wifirapidito.com/public_html"
          test -s "$BASE/payment_registry_lib.php"
          test -s "$BASE/$TMP_NAME"
          php -l "$BASE/$TMP_NAME" >/dev/null

          mkdir -p "$BASE/.deploy-backups"
          if [[ -f "$BASE/payment_audit.php" ]]; then
            cp "$BASE/payment_audit.php" "$BASE/.deploy-backups/payment_audit.php.$SHA"
          fi
          mv "$BASE/$TMP_NAME" "$BASE/payment_audit.php"
          chmod 644 "$BASE/payment_audit.php"
          php -l "$BASE/payment_audit.php" >/dev/null

          php -r '
            require getenv("HOME")."/domains/wifirapidito.com/public_html/payment_registry_lib.php";
            $cutoff=time()-(30*86400); $count=0; $portal=0; $bot=0;
            foreach(payment_registry_history(2000,false) as $r){
              $ts=strtotime((string)($r["validated_at"]??$r["updated_at"]??$r["created_at"]??""));
              if(!$ts || $ts<$cutoff) continue;
              $count++; $s=$r["source"]??"";
              if($s==="portal_autogestion") $portal++;
              if($s==="assistant_virtual") $bot++;
            }
            echo "REGISTRY_30D_TOTAL=$count\nPORTAL_30D=$portal\nBOT_30D=$bot\n";
            if($count<1) exit(2);
          '
          REMOTE

      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 4 --retry-delay 2 -H 'Cache-Control: no-cache' \
            "https://wifirapidito.com/payment_audit.php?health=${GITHUB_SHA}")"
          echo "$body"
          grep -q '2.0-payment-registry-30d' <<<"$body"
          grep -q 'validated-payments-registry' <<<"$body"
          echo 'PAYMENT_HISTORY_DEPLOYED=1'
