name: Promise Leidy Backfill

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/promise-leidy-backfill.yml'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST" && test -n "$HOSTINGER_USER" && test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create idempotent three-month restriction
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger -p 65002 -o BatchMode=yes "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/wifirapidito.com/public_html"
          cd "$APP"
          php -r '
            require "promise_restrictions_lib.php";
            require "config_wisphub.php";
            $username="leidycartagena";
            $incident="2026-09-03";
            $source="gmail:1a065a38e9a4a350";
            $records=pr_load_records();
            foreach($records as $r){
              if(($r["source_event_id"]??"")===$source || (($r["source_message_id"]??"")==="1a065a38e9a4a350")){
                echo "RESULT=ALREADY_PRESENT\nBLOCKED_UNTIL=".substr((string)($r["ends_at"]??""),0,10)."\n"; exit(0);
              }
            }
            $clients=[]; $offset=0; $limit=300; $found=null;
            for($page=0;$page<40;$page++){
              $url=rtrim(WISPHUB_API_URL,"/")."/clientes/?limit=$limit&offset=$offset";
              $ch=curl_init($url);
              curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_HTTPHEADER=>["Authorization: Api-Key ".WISPHUB_TOKEN,"Accept: application/json"],CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>20]);
              $body=curl_exec($ch); $code=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE); curl_close($ch);
              if($body===false||$code<200||$code>=300){fwrite(STDERR,"WispHub client lookup failed HTTP $code\n");exit(2);}
              $d=json_decode($body,true); $batch=is_array($d["results"]??null)?$d["results"]:(is_array($d)&&array_is_list($d)?$d:[]);
              foreach($batch as $c){if(!is_array($c))continue;$u=pr_normalize_username(pr_first_value($c,["usuario","usuario_portal","username"],""));if($u===$username){$found=$c;break 2;}}
              $n=count($batch); if($n===0)break; $offset+=$n; $total=isset($d["count"])&&is_numeric($d["count"])?(int)$d["count"]:null; if($total!==null&&$offset>=$total)break; if($total===null&&$n<$limit&&empty($d["next"]))break;
            }
            if(!$found){fwrite(STDERR,"Client not found\n");exit(3);}
            $ids=pr_identifiers_from_client($found);
            $clientName=trim((string)pr_first_value($found,["nombre","nombre_cliente","name","cliente"],"Leidy Cartagena"));
            $date=DateTimeImmutable::createFromFormat("!Y-m-d",$incident); if(!$date){exit(4);}
            $ends=pr_add_months_clamped($date,3)->setTime(0,0,0);
            foreach($records as &$existing){if(pr_record_is_active($existing)&&pr_records_match($existing,$ids)){echo "RESULT=EXISTING_ACTIVE\nBLOCKED_UNTIL=".substr((string)($existing["ends_at"]??""),0,10)."\n";exit(0);}} unset($existing);
            $record=["id"=>bin2hex(random_bytes(8)),"client_name"=>$clientName,"service_id"=>$ids["service_id"],"client_id"=>$ids["client_id"],"username"=>$ids["username"],"phone"=>$ids["phone"],"cedula"=>trim((string)pr_first_value($found,["cedula","documento","rif"],"")),"email"=>trim((string)pr_first_value($found,["correo","email"],"")),"reason"=>"Incumplimiento de promesa de pago","note"=>"Restricción automática recuperada desde notificación confirmada de WispHub.","incident_date"=>$incident,"starts_at"=>$date->setTime(0,0,0)->format(DATE_ATOM),"ends_at"=>$ends->format(DATE_ATOM),"created_at"=>date(DATE_ATOM),"created_by"=>"wisphub-breach-backfill","source"=>"gmail-wisphub","source_event_id"=>$source,"source_message_id"=>"1a065a38e9a4a350","revoked_at"=>null,"revoked_by"=>null];
            $records[]=$record; if(!pr_save_records($records)){fwrite(STDERR,"Save failed\n");exit(5);} echo "RESULT=CREATED\nBLOCKED_UNTIL=".$ends->format("Y-m-d")."\n";
          '
          REMOTE

      - name: Verify public restriction check
        shell: bash
        run: |
          set -euo pipefail
          echo 'Backfill completed; public check is intentionally not called without two verified identifiers.'
