name: Bot VPS Preflight

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-vps-preflight.yml'
      - 'vps/LIVE_PREFLIGHT_TRIGGER'

permissions:
  contents: read

jobs:
  preflight-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy >/dev/null

      - name: Locate Docker bot server
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_USER"
          candidates=("193.203.188.215")
          if [[ -n "${HOSTINGER_HOST:-}" && "$HOSTINGER_HOST" != "193.203.188.215" ]]; then candidates+=("$HOSTINGER_HOST"); fi

          TARGET_HOST=''; SSH_PORT=''; BOT_DIR=''
          for host in "${candidates[@]}"; do
            for port in 22 65002; do
              SSH=(ssh -i ~/.ssh/hostinger_deploy -p "$port" -o BatchMode=yes -o ConnectTimeout=7 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
              if ! timeout 10 "${SSH[@]}" "$HOSTINGER_USER@$host" 'command -v docker >/dev/null 2>&1' >/dev/null 2>&1; then
                continue
              fi
              candidate_dir="$("${SSH[@]}" "$HOSTINGER_USER@$host" 'for base in "$HOME" /opt /srv; do [[ -d "$base" ]] || continue; find "$base" -maxdepth 8 -type f \( -name docker-compose.yml -o -name compose.yml \) -print 2>/dev/null; done | while IFS= read -r f; do if grep -q "bot_backend:" "$f"; then dirname "$f"; break; fi; done')"
              if [[ -n "$candidate_dir" ]]; then
                TARGET_HOST="$host"; SSH_PORT="$port"; BOT_DIR="$candidate_dir"; break 2
              fi
            done
          done
          test -n "$TARGET_HOST"
          echo "::add-mask::$TARGET_HOST"
          echo "::add-mask::$BOT_DIR"
          printf 'TARGET_HOST=%s\nSSH_PORT=%s\nBOT_DIR=%s\n' "$TARGET_HOST" "$SSH_PORT" "$BOT_DIR" >> "$GITHUB_ENV"

      - name: Stage reconstruction and run non-destructive check
        env:
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/hostinger_deploy -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          SCP=(scp -q -i ~/.ssh/hostinger_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          STAGE="$BOT_DIR/.live-preflight-$GITHUB_SHA"
          "${SSH[@]}" "$HOSTINGER_USER@$TARGET_HOST" "mkdir -p '$STAGE'"
          files=(bot_logic.py bot_entry.py bot_presentation.py bot_flows.py test_bot_flows.py test_bot_conversation.py test_bot_integrations.py test_bot_presentation.py validate_bot_env.py deploy_bot_local.sh reset_whatsapp.sh set_webhook.py get_qr.py requirements-bot.txt Dockerfile.bot)
          for file in "${files[@]}"; do "${SCP[@]}" "vps/$file" "$HOSTINGER_USER@$TARGET_HOST:$STAGE/$file"; done

          "${SSH[@]}" "$HOSTINGER_USER@$TARGET_HOST" "BOT_DIR='$BOT_DIR' STAGE='$STAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$BOT_DIR"
          test -f .env
          command -v docker >/dev/null
          backup_dir=".bot-backups/preflight-${STAGE##*-}"
          mkdir -p "$backup_dir"
          files=(bot_logic.py bot_entry.py bot_presentation.py bot_flows.py test_bot_flows.py test_bot_conversation.py test_bot_integrations.py test_bot_presentation.py validate_bot_env.py deploy_bot_local.sh reset_whatsapp.sh set_webhook.py get_qr.py requirements-bot.txt Dockerfile.bot)
          for file in "${files[@]}"; do [[ -f "$file" ]] && cp -a "$file" "$backup_dir/$file"; cp -a "$STAGE/$file" "$file"; done
          chmod +x deploy_bot_local.sh reset_whatsapp.sh
          cleanup() {
            rc=$?
            for file in "${files[@]}"; do
              if [[ -f "$backup_dir/$file" ]]; then cp -a "$backup_dir/$file" "$file"; else rm -f "$file"; fi
            done
            rm -rf "$STAGE"
            exit $rc
          }
          trap cleanup EXIT
          ./deploy_bot_local.sh check
          echo 'PRECHECK_OK=1'
          REMOTE

      - name: Confirm production bot remains running
        env:
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/hostinger_deploy -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          "${SSH[@]}" "$HOSTINGER_USER@$TARGET_HOST" "cd '$BOT_DIR' && docker compose ps bot_backend && curl -fsS http://127.0.0.1:5000/webhook"
