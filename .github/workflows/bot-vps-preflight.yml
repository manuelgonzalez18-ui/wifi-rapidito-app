name: Bot VPS Preflight

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-vps-preflight.yml'
      - 'vps/LIVE_PREFLIGHT_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_HOST: 76.13.100.2
      SSH_PORT: '22'
      TARGET_USER: root
      EXPECTED_HOST_FP: SHA256:bO3AdnzChlN7ZSaozrNfs3C0wLT6cvMyI4Jg1D78qYQ
      BOT_DIR: /home/bot.local/public_html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure verified VPS SSH
        env:
          BOT_VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_VPS_SSH_KEY_B64"
          mkdir -p ~/.ssh
          printf '%s' "$BOT_VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
          ssh-keyscan -T 5 -t ed25519 -p "$SSH_PORT" "$TARGET_HOST" > ~/.ssh/known_hosts 2>/dev/null
          actual_fp=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | head -1)
          test "$actual_fp" = "$EXPECTED_HOST_FP"
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" 'echo VPS_CONNECTION_OK'

      - name: Read-only production inspection
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" "BOT_DIR='$BOT_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$BOT_DIR"
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"
          test -f .env
          test -f bot_logic.py
          test -f bot_entry.py
          echo 'APP_LAYOUT_OK=1'

          docker --version
          docker ps --format 'NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}'
          for c in bot_backend evolution_api redis_bot; do
            test "$(docker inspect -f '{{.State.Running}}' "$c")" = true
            echo "CONTAINER_${c}=RUNNING"
          done

          bot_health=$(curl -fsS --max-time 8 http://127.0.0.1:5000/webhook)
          printf '%s\n' "$bot_health"
          grep -q '"status":"ok"' <<<"$bot_health"
          grep -q '4.0-bot-10-opciones' <<<"$bot_health"
          echo 'BOT_HEALTH_OK=1'

          docker exec bot_backend test -f /app/bot_logic.py
          docker exec bot_backend test -f /app/bot_entry.py
          docker exec bot_backend grep -q 'message.startswith("hola")' /app/bot_entry.py
          docker exec bot_backend grep -q 'Beneficio suspendido por incumplimiento' /app/bot_entry.py
          echo 'ACTIVE_BOT_CODE_OK=1'

          docker exec bot_backend sh -lc 'test -n "$WISPHUB_API_KEY" && echo WISPHUB_API_KEY=SET || echo WISPHUB_API_KEY=MISSING'
          docker exec bot_backend sh -lc 'if test -n "$EVO_API_KEY" || test -n "$META_ACCESS_TOKEN"; then echo WHATSAPP_CREDENTIALS=SET; else echo WHATSAPP_CREDENTIALS=MISSING; fi'

          evo_code=$(curl -sS --max-time 8 -o /tmp/evo_health.txt -w '%{http_code}' http://127.0.0.1:8080/ || true)
          echo "EVOLUTION_HTTP=$evo_code"

          if docker compose config >/dev/null 2>/tmp/compose_error; then
            echo 'COMPOSE_CONFIG=OK'
          else
            echo 'COMPOSE_CONFIG=INVALID_NONBLOCKING'
            head -1 /tmp/compose_error || true
          fi
          REMOTE

      - name: Confirm production containers still running
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" \
            "for c in bot_backend evolution_api redis_bot; do test \"\$(docker inspect -f '{{.State.Running}}' \"\$c\")\" = true || exit 1; done; echo NO_RESTART_REQUIRED=1"
