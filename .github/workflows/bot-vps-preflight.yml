name: Bot VPS Preflight

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-vps-preflight.yml'
      - 'vps/LIVE_PREFLIGHT_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_HOST: 76.13.100.2
      SSH_PORT: '22'
      TARGET_USER: root
      EXPECTED_HOST_FP: SHA256:bO3AdnzChlN7ZSaozrNfs3C0wLT6cvMyI4Jg1D78qYQ
      BOT_DIR: /home/bot.local/public_html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure verified VPS SSH
        env:
          BOT_VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_VPS_SSH_KEY_B64"
          mkdir -p ~/.ssh
          printf '%s' "$BOT_VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
          ssh-keyscan -T 5 -t ed25519 -p "$SSH_PORT" "$TARGET_HOST" > ~/.ssh/known_hosts 2>/dev/null
          actual_fp=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | head -1)
          test "$actual_fp" = "$EXPECTED_HOST_FP"
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" 'echo VPS_CONNECTION_OK'

      - name: Read-only production inspection
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$TARGET_USER@$TARGET_HOST")
          "${SSH[@]}" "BOT_DIR='$BOT_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$BOT_DIR"
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"
          test -f docker-compose.yml
          test -f .env
          test -f bot_logic.py
          test -f bot_entry.py
          echo "APP_LAYOUT_OK=1"
          docker --version
          docker compose version
          docker compose ps
          docker ps --format 'NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}'
          echo "BOT_HEALTH_BEGIN"
          curl -fsS --max-time 5 http://127.0.0.1:5000/webhook || true
          echo
          echo "BOT_HEALTH_END"
          echo "EVOLUTION_HEALTH_BEGIN"
          curl -fsS --max-time 5 http://127.0.0.1:8080/ || true
          echo
          echo "EVOLUTION_HEALTH_END"
          set -a
          source .env
          set +a
          [[ -n "${EVO_API_KEY:-}" ]] && echo 'EVO_API_KEY=SET' || echo 'EVO_API_KEY=MISSING'
          [[ -n "${WISPHUB_API_KEY:-}" ]] && echo 'WISPHUB_API_KEY=SET' || echo 'WISPHUB_API_KEY=MISSING'
          echo "INSTANCE_NAME=${INSTANCE_NAME:-rapidito_bot}"
          if [[ -n "${EVO_API_KEY:-}" ]]; then
            code=$(curl -sS --max-time 8 -o /tmp/rapidito_instances.json -w '%{http_code}' -H "apikey: $EVO_API_KEY" http://127.0.0.1:8080/instance/fetchInstances || true)
            echo "EVOLUTION_INSTANCES_HTTP=$code"
            if [[ "$code" == "200" ]]; then
              python3 - <<'PY'
          import json
          p='/tmp/rapidito_instances.json'
          try:
              data=json.load(open(p))
          except Exception:
              print('EVOLUTION_JSON=INVALID')
              raise SystemExit
          items=data if isinstance(data,list) else data.get('instances',[]) if isinstance(data,dict) else []
          print('EVOLUTION_INSTANCE_COUNT='+str(len(items)))
          for item in items:
              if not isinstance(item,dict):
                  continue
              nested=item.get('instance') if isinstance(item.get('instance'),dict) else {}
              name=item.get('instanceName') or item.get('name') or nested.get('instanceName')
              state=item.get('connectionStatus') or item.get('state') or nested.get('state') or nested.get('status')
              if name:
                  print(f'EVOLUTION_INSTANCE={name} STATE={state}')
          PY
            fi
          fi
          REMOTE

      - name: Confirm no restart occurred
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" \
            "cd '$BOT_DIR' && docker compose ps bot_backend evolution_api"
