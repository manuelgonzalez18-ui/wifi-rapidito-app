name: Payment Runtime Paths Readonly

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/payment-runtime-paths-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy >/dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts

      - name: Inspect active payment storage and WispHub host
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domains/wifirapidito.com/public_html"
          LIB="$BASE/payment_registry_lib.php"
          CONFIG="$BASE/config_wisphub.php"
          PROXY="$BASE/proxy_payments.php"
          test -s "$LIB"
          test -s "$CONFIG"
          test -s "$PROXY"

          echo '=== Live registry contract ==='
          php -l "$LIB" >/dev/null
          php -r '
            require $argv[1];
            $path=payment_registry_store_path();
            echo "registry_basename=" . basename($path) . "\n";
            echo "registry_dir_basename=" . basename(dirname($path)) . "\n";
            echo "registry_exists=" . (is_file($path) ? "yes" : "no") . "\n";
            echo "registry_size=" . (is_file($path) ? (string)filesize($path) : "0") . "\n";
            $records=payment_registry_all_records();
            echo "registry_records=" . count($records) . "\n";
            $counts=[];
            foreach ($records as $r) {
              if (!is_array($r)) continue;
              $s=(string)($r["status"] ?? "unknown");
              $counts[$s]=($counts[$s]??0)+1;
            }
            ksort($counts);
            foreach ($counts as $s=>$n) echo "status_" . preg_replace("/[^A-Za-z0-9_-]/","_",$s) . "=" . $n . "\n";
          ' "$LIB"

          echo '=== Nearby payment files metadata only ==='
          PRIVATE="$(dirname "$BASE")/.wifi-rapidito-private"
          if [ -d "$PRIVATE" ]; then
            find "$PRIVATE" -maxdepth 1 -type f \( -iname '*payment*.json' -o -iname '*payment*.lock' \) -printf '%f\t%s bytes\t%TY-%Tm-%TdT%TH:%TM:%TS\n' | sort
          else
            echo 'private_dir_present=no'
          fi

          echo '=== Live WispHub config ==='
          php -r '
            require $argv[1];
            foreach (["WISPHUB_API_URL"] as $name) {
              if (!defined($name)) { echo $name . "=undefined\n"; continue; }
              $v=(string)constant($name);
              echo $name . "_host=" . (parse_url($v, PHP_URL_HOST) ?: "invalid") . "\n";
              echo $name . "_path=" . (parse_url($v, PHP_URL_PATH) ?: "/") . "\n";
            }
            echo "WISPHUB_TOKEN_configured=" . ((defined("WISPHUB_TOKEN") && strlen((string)WISPHUB_TOKEN)>0) ? "yes" : "no") . "\n";
          ' "$CONFIG"

          echo '=== Live proxy WispHub URL construction ==='
          grep -nE 'WISPHUB_API_URL|registrar-pago|reportar-pago' "$PROXY" | sed -E 's/[[:space:]]+/ /g' | head -30 || true
          REMOTE
