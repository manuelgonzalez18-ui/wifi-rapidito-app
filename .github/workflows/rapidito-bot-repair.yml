name: Rapidito Bot Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rapidito-bot-repair.yml'
      - 'vps/bot_logic.py'
      - 'vps/kommo_service.py'
      - 'vps/Dockerfile.bot'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VPS SSH
        env:
          VPS_HOST: ${{ secrets.BOT_VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
          VPS_PORT_RAW: ${{ secrets.BOT_VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY_B64"
          VPS_PORT="$(printf '%s' "$VPS_PORT_RAW" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if ! [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || [ "$VPS_PORT" -lt 1 ] || [ "$VPS_PORT" -gt 65535 ]; then
            VPS_PORT=22
          fi
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/rapidito_vps
          chmod 600 ~/.ssh/rapidito_vps
          ssh-keygen -y -f ~/.ssh/rapidito_vps >/dev/null
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/rapidito_vps -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 "root@$VPS_HOST" 'true'
          printf 'RAPIDITO_HOST=%s\nRAPIDITO_PORT=%s\n' "$VPS_HOST" "$VPS_PORT" >> "$GITHUB_ENV"

      - name: Upload bot files
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/rapidito_vps -P "$RAPIDITO_PORT" vps/bot_logic.py "root@$RAPIDITO_HOST:/tmp/rapidito-bot_logic.py"
          scp -i ~/.ssh/rapidito_vps -P "$RAPIDITO_PORT" vps/kommo_service.py "root@$RAPIDITO_HOST:/tmp/rapidito-kommo_service.py"
          scp -i ~/.ssh/rapidito_vps -P "$RAPIDITO_PORT" vps/Dockerfile.bot "root@$RAPIDITO_HOST:/tmp/rapidito-Dockerfile.bot"

      - name: Repair live Rapidito project
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rapidito_vps -p "$RAPIDITO_PORT" "root@$RAPIDITO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          systemctl enable --now docker
          for attempt in $(seq 1 20); do
            docker info >/dev/null 2>&1 && break
            [ "$attempt" -lt 20 ] || { systemctl status docker --no-pager 2>&1 || true; exit 1; }
            sleep 2
          done
          echo 'Docker daemon is running.'

          app_dir='/home/bot.local/public_html'
          compose_file="$app_dir/docker-compose.yml"
          if [ ! -f "$compose_file" ]; then
            echo "Live Rapidito compose file not found at $compose_file"
            find /home -maxdepth 5 -type f \( -name docker-compose.yml -o -name compose.yml \) -print 2>/dev/null || true
            exit 1
          fi

          echo "Using live Rapidito project: $app_dir"
          echo 'Configured images:'
          grep -E '^[[:space:]]*image:' "$compose_file" | sed -E 's/^/  /' || true
          echo 'Local Docker images:'
          docker images --format '{{.Repository}}:{{.Tag}}' | sort | sed -n '1,80p'

          cd "$app_dir"
          if ! docker compose config >/dev/null 2>&1; then
            echo 'The live docker-compose.yml is invalid.'
            docker compose config 2>&1 || true
            exit 1
          fi

          if [ ! -s "$app_dir/.env" ]; then
            echo 'The live Rapidito .env file is missing.'
            exit 1
          fi

          stamp="$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$app_dir/.repair-backups"
          for f in Dockerfile.bot bot_logic.py kommo_service.py; do
            [ -f "$app_dir/$f" ] && cp "$app_dir/$f" "$app_dir/.repair-backups/$f.$stamp.bak" || true
          done
          cp /tmp/rapidito-Dockerfile.bot "$app_dir/Dockerfile.bot"
          cp /tmp/rapidito-bot_logic.py "$app_dir/bot_logic.py"
          cp /tmp/rapidito-kommo_service.py "$app_dir/kommo_service.py"
          rm -f /tmp/rapidito-bot_logic.py /tmp/rapidito-kommo_service.py /tmp/rapidito-Dockerfile.bot
          python3 -m py_compile "$app_dir/bot_logic.py" "$app_dir/kommo_service.py"

          docker compose up -d --build bot_backend

          for attempt in $(seq 1 30); do
            if docker inspect -f '{{.State.Running}}' bot_backend 2>/dev/null | grep -qx true \
              && docker exec bot_backend python -m py_compile /app/bot_logic.py >/dev/null 2>&1; then
              echo 'Rapidito bot container is running.'
              docker exec bot_backend sh -lc 'printf "WHATSAPP_PROVIDER=%s\n" "${WHATSAPP_PROVIDER:-evolution}"; if [ -n "${META_ACCESS_TOKEN:-}" ] && [ -n "${META_PHONE_NUMBER_ID:-}" ]; then echo META_CONFIGURED=true; else echo META_CONFIGURED=false; fi'
              curl -fsS http://127.0.0.1:5000/webhook || true
              echo
              docker logs --tail 60 bot_backend 2>&1 || true
              exit 0
            fi
            sleep 4
          done

          echo 'Rapidito bot did not become healthy.'
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          docker logs --tail 120 bot_backend 2>&1 || true
          exit 1
          REMOTE
