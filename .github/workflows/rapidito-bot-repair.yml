name: Rapidito Bot Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rapidito-bot-repair.yml'
      - 'vps/bot_logic.py'
      - 'vps/kommo_service.py'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VPS SSH
        env:
          VPS_HOST: ${{ secrets.BOT_VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
          VPS_PORT_RAW: ${{ secrets.BOT_VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY_B64"
          VPS_PORT="$(printf '%s' "$VPS_PORT_RAW" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if ! [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || [ "$VPS_PORT" -lt 1 ] || [ "$VPS_PORT" -gt 65535 ]; then
            VPS_PORT=22
          fi
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/rapidito_vps
          chmod 600 ~/.ssh/rapidito_vps
          ssh-keygen -y -f ~/.ssh/rapidito_vps >/dev/null
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/rapidito_vps -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 "root@$VPS_HOST" 'true'
          printf 'RAPIDITO_HOST=%s\nRAPIDITO_PORT=%s\n' "$VPS_HOST" "$VPS_PORT" >> "$GITHUB_ENV"

      - name: Upload bot files
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/rapidito_vps -P "$RAPIDITO_PORT" vps/bot_logic.py "root@$RAPIDITO_HOST:/tmp/rapidito-bot_logic.py"
          scp -i ~/.ssh/rapidito_vps -P "$RAPIDITO_PORT" vps/kommo_service.py "root@$RAPIDITO_HOST:/tmp/rapidito-kommo_service.py"

      - name: Recover Rapidito containers
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rapidito_vps -p "$RAPIDITO_PORT" "root@$RAPIDITO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          systemctl enable --now docker
          for attempt in $(seq 1 20); do
            docker info >/dev/null 2>&1 && break
            [ "$attempt" -lt 20 ] || { systemctl status docker --no-pager 2>&1 || true; exit 1; }
            sleep 2
          done
          echo 'Docker daemon is running.'
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

          if ! docker inspect evolution_api >/dev/null 2>&1; then
            echo 'Existing evolution_api container was not found.'
            exit 1
          fi
          if ! docker inspect bot_backend >/dev/null 2>&1; then
            echo 'Existing bot_backend container was not found.'
            exit 1
          fi

          docker start evolution_api >/dev/null || true
          docker start bot_backend >/dev/null || true

          for attempt in $(seq 1 20); do
            evo_running="$(docker inspect -f '{{.State.Running}}' evolution_api 2>/dev/null || true)"
            bot_running="$(docker inspect -f '{{.State.Running}}' bot_backend 2>/dev/null || true)"
            if [ "$evo_running" = true ] && [ "$bot_running" = true ]; then
              break
            fi
            sleep 2
          done

          echo 'Container state after restart:'
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          test "$(docker inspect -f '{{.State.Running}}' evolution_api)" = true
          test "$(docker inspect -f '{{.State.Running}}' bot_backend)" = true

          docker cp /tmp/rapidito-bot_logic.py bot_backend:/app/bot_logic.py
          docker cp /tmp/rapidito-kommo_service.py bot_backend:/app/kommo_service.py
          rm -f /tmp/rapidito-bot_logic.py /tmp/rapidito-kommo_service.py
          docker restart bot_backend >/dev/null

          for attempt in $(seq 1 25); do
            if docker inspect -f '{{.State.Running}}' bot_backend 2>/dev/null | grep -qx true \
              && docker exec bot_backend python -m py_compile /app/bot_logic.py /app/kommo_service.py >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:5000/webhook >/tmp/rapidito-health.json 2>/dev/null; then
              echo 'Rapidito bot is running and webhook health responds.'
              cat /tmp/rapidito-health.json
              echo
              docker exec bot_backend sh -lc 'printf "WHATSAPP_PROVIDER=%s\n" "${WHATSAPP_PROVIDER:-evolution}"'
              echo 'Evolution container recent logs:'
              docker logs --tail 40 evolution_api 2>&1 || true
              echo 'Rapidito bot recent logs:'
              docker logs --tail 60 bot_backend 2>&1 || true
              exit 0
            fi
            sleep 3
          done

          echo 'Rapidito health check failed after restarting existing containers.'
          docker logs --tail 100 evolution_api 2>&1 || true
          docker logs --tail 120 bot_backend 2>&1 || true
          exit 1
          REMOTE
