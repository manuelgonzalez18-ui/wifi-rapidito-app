name: Deploy Rapidito 10-Option Bot

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - 'vps/*.py'
      - 'vps/requirements-bot.txt'
      - 'vps/Dockerfile.bot'
      - '.github/workflows/deploy-10-option-bot.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rapidito-production-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_HOST: 76.13.100.2
      SSH_PORT: '22'
      TARGET_USER: root
      EXPECTED_HOST_FP: SHA256:bO3AdnzChlN7ZSaozrNfs3C0wLT6cvMyI4Jg1D78qYQ

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bot source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile vps/*.py
          grep -q 'Promesa de pago temporalmente no disponible' vps/bot_logic.py
          grep -q 'Beneficio suspendido por incumplimiento' vps/bot_logic.py
          grep -q 'Podrás solicitar nuevamente una Promesa de Pago a partir' vps/bot_logic.py
          grep -q 'message.startswith("hola")' vps/bot_entry.py

      - name: Configure verified VPS SSH
        env:
          BOT_VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_VPS_SSH_KEY_B64"
          mkdir -p ~/.ssh
          printf '%s' "$BOT_VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
          ssh-keyscan -T 5 -t ed25519 -p "$SSH_PORT" "$TARGET_HOST" > ~/.ssh/known_hosts 2>/dev/null
          actual_fp=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | head -1)
          test "$actual_fp" = "$EXPECTED_HOST_FP"
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" 'echo VPS_CONNECTION_OK'

      - name: Package bot
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/rapidito-bot-$GITHUB_SHA.tgz --exclude='__pycache__' --exclude='*.pyc' -C vps .
          scp -i ~/.ssh/key -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/rapidito-bot-$GITHUB_SHA.tgz \
            "$TARGET_USER@$TARGET_HOST:/root/rapidito-bot-$GITHUB_SHA.tgz"

      - name: Build and deploy with rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" \
            "GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          exec 9>/var/lock/rapidito-production-bot.lock
          flock -w 120 9
          APP=/home/bot.local/public_html
          SHORT=${GITHUB_SHA:0:12}
          STAGE=/root/rapidito-bot-$SHORT
          IMAGE=wifi-rapidito-bot:promise-message-$SHORT
          STAMP=$(date +%Y%m%d-%H%M%S)
          OLD="bot_backend_pre_promise_message_$STAMP"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "/root/rapidito-bot-$GITHUB_SHA.tgz" -C "$STAGE"

          cd "$STAGE"
          grep -q 'Promesa de pago temporalmente no disponible' bot_logic.py
          grep -q 'Beneficio suspendido por incumplimiento' bot_logic.py
          grep -q 'Podrás solicitar nuevamente una Promesa de Pago a partir' bot_logic.py
          grep -q 'message.startswith("hola")' bot_entry.py
          docker build -f Dockerfile.bot -t "$IMAGE" .

          old_health=$(curl -fsS http://127.0.0.1:5000/webhook)
          printf '%s' "$old_health" | grep -q '"status":"ok"'
          docker inspect -f '{{.State.Running}}' evolution_api | grep -q true
          docker inspect -f '{{.State.Running}}' redis_bot | grep -q true

          docker stop -t 15 bot_backend >/dev/null
          docker rename bot_backend "$OLD"

          rollback() {
            echo 'ROLLBACK_BEGIN=1'
            docker rm -f bot_backend >/dev/null 2>&1 || true
            if docker inspect "$OLD" >/dev/null 2>&1; then
              docker rename "$OLD" bot_backend >/dev/null 2>&1 || true
              docker start bot_backend >/dev/null 2>&1 || true
            fi
          }
          trap 'rc=$?; if [ $rc -ne 0 ]; then rollback; fi; exit $rc' EXIT

          docker run -d \
            --name bot_backend \
            --restart always \
            --network public_html_default \
            --env-file "$APP/.env" \
            -p 5000:5000 \
            "$IMAGE" >/dev/null

          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/webhook >/tmp/new-health.json 2>/dev/null && \
               grep -q '"status":"ok"' /tmp/new-health.json && \
               grep -q '4.0-bot-10-opciones' /tmp/new-health.json && \
               docker exec bot_backend grep -q 'Promesa de pago temporalmente no disponible' /app/bot_logic.py && \
               docker exec bot_backend grep -q 'Beneficio suspendido por incumplimiento' /app/bot_logic.py && \
               docker exec bot_backend grep -q 'Podrás solicitar nuevamente una Promesa de Pago a partir' /app/bot_logic.py && \
               docker exec bot_backend grep -q 'La suspensión vence automáticamente en esa fecha' /app/bot_logic.py && \
               docker exec bot_backend grep -q 'pagos, facturas y soporte técnico' /app/bot_logic.py && \
               docker exec bot_backend grep -q 'message.startswith("hola")' /app/bot_entry.py; then
              healthy=1
              break
            fi
            sleep 1
          done

          test "$healthy" = 1
          docker inspect -f '{{.State.Running}}' bot_backend | grep -q true
          docker inspect -f '{{.State.Running}}' evolution_api | grep -q true
          docker inspect -f '{{.State.Running}}' redis_bot | grep -q true

          trap - EXIT
          echo 'RAPIDITO_PROMISE_MESSAGE_DEPLOYED=1'
          echo "IMAGE=$IMAGE"
          echo "ROLLBACK_CONTAINER=$OLD"
          REMOTE

      - name: Publish deployment status
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Rapidito 10-Option Bot Deploy',
              description: 'Promise restriction message deployed and verified on VPS',
            });
