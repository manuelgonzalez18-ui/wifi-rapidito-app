name: Bot WhatsApp Live Smoke

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-whatsapp-live-smoke.yml'
      - 'vps/LIVE_WHATSAPP_TRIGGER'

permissions:
  contents: read

jobs:
  whatsapp-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bot dependencies
        run: python -m pip install --disable-pip-version-check -r vps/requirements-bot.txt

      - name: Send harmless live WhatsApp smoke message
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source vps/.env
          set +a
          test -n "$HOSTINGER_HOST"
          if [[ "${WHATSAPP_PROVIDER:-evolution}" == "evolution" ]]; then
            export EVO_API_URL="http://$HOSTINGER_HOST:8080"
          fi
          cd vps
          python - <<'PY'
          import asyncio
          import bot_presentation as presentation

          bot = presentation.bot

          async def main():
              provider = bot.WHATSAPP_PROVIDER
              if provider not in {"meta", "evolution"}:
                  raise SystemExit("Proveedor WhatsApp inválido")
              print(f"WhatsApp provider configured: {provider}")
              ok = await bot.enviar_whatsapp(
                  bot.ADMIN_REPORT_NUMBER,
                  "🧪 Prueba técnica de Rapidito: canal WhatsApp activo. No requiere respuesta.",
              )
              if not ok:
                  raise SystemExit("No fue posible entregar el mensaje de prueba por el proveedor configurado")
              print("LIVE_WHATSAPP_OUTBOUND_OK=1")

          asyncio.run(main())
          PY
