name: Bot WhatsApp Live Smoke

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-whatsapp-live-smoke.yml'
      - 'vps/LIVE_WHATSAPP_TRIGGER'

permissions:
  contents: read

jobs:
  whatsapp-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bot dependencies
        run: python -m pip install --disable-pip-version-check -r vps/requirements-bot.txt

      - name: Send harmless live WhatsApp smoke message
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          META_ACCESS_TOKEN_SECRET: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID_SECRET: ${{ secrets.META_PHONE_NUMBER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source vps/.env
          set +a

          if [[ -n "${META_ACCESS_TOKEN_SECRET:-}" && -n "${META_PHONE_NUMBER_ID_SECRET:-}" ]]; then
            export META_ACCESS_TOKEN="$META_ACCESS_TOKEN_SECRET"
            export META_PHONE_NUMBER_ID="$META_PHONE_NUMBER_ID_SECRET"
          fi

          # Para la prueba desde GitHub usamos Meta directamente cuando las
          # credenciales existen. Evolution solo es alcanzable dentro del VPS.
          if [[ -n "${META_ACCESS_TOKEN:-}" && -n "${META_PHONE_NUMBER_ID:-}" ]]; then
            export WHATSAPP_PROVIDER=meta
          else
            test -n "$HOSTINGER_HOST"
            export WHATSAPP_PROVIDER=evolution
            export EVO_API_URL="http://$HOSTINGER_HOST:8080"
          fi

          cd vps
          python - <<'PY'
          import asyncio
          import bot_presentation as presentation

          bot = presentation.bot

          async def main():
              provider = bot.WHATSAPP_PROVIDER
              if provider not in {"meta", "evolution"}:
                  raise SystemExit("Proveedor WhatsApp inválido")
              print(f"WhatsApp provider configured for smoke: {provider}")
              ok = await bot.enviar_whatsapp(
                  bot.ADMIN_REPORT_NUMBER,
                  "🧪 Prueba técnica de Rapidito: canal WhatsApp activo. No requiere respuesta.",
              )
              if not ok:
                  raise SystemExit("No fue posible entregar el mensaje de prueba por el proveedor configurado")
              print("LIVE_WHATSAPP_OUTBOUND_OK=1")

          asyncio.run(main())
          PY
