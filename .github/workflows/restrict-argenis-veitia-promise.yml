name: Restrict Argenis Veitia Promise

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restrict-argenis-veitia-promise.yml'

permissions:
  contents: read

jobs:
  apply-restriction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_promise_restrict
          chmod 600 ~/.ssh/hostinger_promise_restrict
          ssh-keygen -y -f ~/.ssh/hostinger_promise_restrict >/dev/null
          ssh-keyscan -T 10 -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Resolve client and apply 3-month restriction
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_promise_restrict -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domains/wifirapidito.com/public_html"
          cd "$BASE"

          php <<'PHP'
          <?php
          require __DIR__ . '/config_wisphub.php';
          require __DIR__ . '/promise_restrictions_lib.php';

          $targetUsername = 'argenisveitia';
          $incidentDate = '2026-09-06';
          $tz = new DateTimeZone('America/Caracas');

          function op_get_json(string $url): array {
              $ch = curl_init($url);
              curl_setopt_array($ch, [
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_HTTPHEADER => [
                      'Authorization: Api-Key ' . WISPHUB_TOKEN,
                      'Accept: application/json',
                  ],
                  CURLOPT_CONNECTTIMEOUT => 8,
                  CURLOPT_TIMEOUT => 20,
                  CURLOPT_SSL_VERIFYPEER => true,
                  CURLOPT_SSL_VERIFYHOST => 2,
              ]);
              $body = curl_exec($ch);
              $http = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE);
              $error = curl_error($ch);
              curl_close($ch);
              if ($error !== '' || $http < 200 || $http >= 300 || !is_string($body)) {
                  throw new RuntimeException('No se pudo consultar el directorio de clientes de WispHub.');
              }
              $decoded = json_decode($body, true);
              if (!is_array($decoded)) throw new RuntimeException('Respuesta inválida del directorio WispHub.');
              return $decoded;
          }

          $client = null;
          $offset = 0;
          $limit = 300;
          for ($page = 0; $page < 40; $page++) {
              $url = rtrim(WISPHUB_API_URL, '/') . '/clientes/?limit=' . $limit . '&offset=' . $offset;
              $payload = op_get_json($url);
              $items = is_array($payload['results'] ?? null) ? $payload['results'] : (array_is_list($payload) ? $payload : [$payload]);
              foreach ($items as $candidate) {
                  if (!is_array($candidate)) continue;
                  $username = pr_normalize_username(pr_first_value($candidate, ['usuario', 'usuario_portal', 'username'], ''));
                  if ($username === $targetUsername) {
                      $client = $candidate;
                      break 2;
                  }
              }
              $received = count($items);
              if ($received === 0) break;
              $offset += $received;
              $total = isset($payload['count']) && is_numeric($payload['count']) ? (int)$payload['count'] : null;
              if ($total !== null && $offset >= $total) break;
              if ($total === null && $received < $limit && empty($payload['next'])) break;
          }

          if (!is_array($client)) {
              throw new RuntimeException('No se encontró en WispHub el usuario exacto argenisveitia@wifi-rapidito.');
          }

          $ids = pr_identifiers_from_client($client);
          if (($ids['username'] ?? '') !== $targetUsername) {
              throw new RuntimeException('La identidad resuelta no coincide con el usuario solicitado.');
          }
          if (trim((string)($ids['service_id'] ?? '')) === '') {
              throw new RuntimeException('El cliente resuelto no tiene ID de servicio; se cancela para evitar bloquear a otra persona.');
          }

          $summary = [
              'name' => trim((string)pr_first_value($client, ['nombre', 'name', 'cliente'], 'Argenis Veitia')),
              'service_id' => trim((string)($ids['service_id'] ?? '')),
              'client_id' => trim((string)($ids['client_id'] ?? '')),
              'username' => $targetUsername,
              'phone' => trim((string)($ids['phone'] ?? '')),
              'cedula' => trim((string)pr_first_value($client, ['cedula', 'documento', 'rif'], '')),
              'email' => trim((string)pr_first_value($client, ['correo', 'email'], '')),
          ];

          $records = pr_load_records();
          foreach ($records as $existing) {
              if (pr_record_is_active($existing) && pr_records_match($existing, $summary)) {
                  echo 'restriction_already_active=yes' . PHP_EOL;
                  echo 'blocked_until=' . substr((string)($existing['ends_at'] ?? ''), 0, 10) . PHP_EOL;
                  exit(0);
              }
          }

          $date = DateTimeImmutable::createFromFormat('!Y-m-d', $incidentDate, $tz);
          if (!$date) throw new RuntimeException('Fecha de incumplimiento inválida.');
          $startsAt = $date->setTime(0, 0, 0);
          $endsAt = pr_add_months_clamped($date, 3)->setTime(0, 0, 0);
          $now = new DateTimeImmutable('now', $tz);

          $record = [
              'id' => bin2hex(random_bytes(8)),
              'client_name' => $summary['name'],
              'service_id' => $summary['service_id'],
              'client_id' => $summary['client_id'],
              'username' => $summary['username'],
              'phone' => $summary['phone'],
              'cedula' => $summary['cedula'],
              'email' => $summary['email'],
              'reason' => 'Incumplimiento de promesa de pago',
              'note' => 'Restricción administrativa por notificación de Corte Automático de WispHub del 06/09/2026.',
              'incident_date' => $incidentDate,
              'starts_at' => $startsAt->format(DATE_ATOM),
              'ends_at' => $endsAt->format(DATE_ATOM),
              'created_at' => $now->format(DATE_ATOM),
              'created_by' => 'administrador',
              'revoked_at' => null,
              'revoked_by' => null,
          ];

          $records[] = $record;
          if (!pr_save_records($records)) {
              throw new RuntimeException('No se pudo guardar la restricción.');
          }

          $verified = pr_find_active_restriction($summary);
          if (!is_array($verified) || ($verified['id'] ?? '') !== $record['id']) {
              throw new RuntimeException('La restricción se guardó pero no pudo verificarse como activa.');
          }

          echo 'restriction_applied=yes' . PHP_EOL;
          echo 'client=' . $summary['name'] . PHP_EOL;
          echo 'username=' . $summary['username'] . PHP_EOL;
          echo 'blocked_until=' . $endsAt->format('Y-m-d') . PHP_EOL;
          ?>
          PHP
          REMOTE

      - name: Verify public restriction gate
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS -H 'Cache-Control: no-cache' 'https://wifirapidito.com/promise_restrictions.php?action=check&service_id=placeholder&username=argenisveitia' 2>/dev/null || true)"
          # The public check requires two real identifiers and may reject the placeholder.
          # The authoritative verification is the server-side active-record check above.
          test -n "$body" || true
          echo 'Server-side active restriction verification completed.'
