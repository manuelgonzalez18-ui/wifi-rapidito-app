name: Rapidito Live Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rapidito-live-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH for the existing Rapidito VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.BOT_VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
          VPS_PORT_RAW: ${{ secrets.BOT_VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY_B64"
          VPS_PORT="$(printf '%s' "$VPS_PORT_RAW" | tr -d '[:space:]')"
          if ! [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || [ "$VPS_PORT" -lt 1 ] || [ "$VPS_PORT" -gt 65535 ]; then VPS_PORT=22; fi
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/rapidito_vps
          chmod 600 ~/.ssh/rapidito_vps
          ssh-keygen -y -f ~/.ssh/rapidito_vps >/dev/null
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "RAPIDITO_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "RAPIDITO_PORT=$VPS_PORT" >> "$GITHUB_ENV"

      - name: Inspect server and WhatsApp health without modifying anything
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rapidito_vps -p "$RAPIDITO_PORT" -o BatchMode=yes -o ConnectTimeout=15 "root@$RAPIDITO_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "CHECK_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "DOCKER_SERVICE=$(systemctl is-active docker 2>/dev/null || true)"
          echo '---CONTAINERS---'
          docker ps -a --format 'name={{.Names}} status={{.Status}} ports={{.Ports}}' 2>&1 | grep -E '^(name=(bot_backend|evolution_api|redis_bot|bot_backend_pre_|rapidito)|Cannot connect|permission)' | head -n 28 || true
          echo '---PRIMARY INSPECT---'
          for c in bot_backend evolution_api; do
            docker inspect -f 'name={{.Name}} state={{.State.Status}} restarts={{.RestartCount}} started={{.State.StartedAt}} port5000={{(index .NetworkSettings.Ports "5000/tcp")}}' "$c" 2>/dev/null || echo "missing_or_unavailable=$c"
          done
          echo '---PUBLIC HOST PORT 5000---'
          curl -sS -m 8 -w '\nhttp_code=%{http_code}\n' http://127.0.0.1:5000/webhook 2>&1 | head -c 700; echo
          echo '---PRIMARY CONTAINER HEALTH---'
          docker exec bot_backend python -c 'import urllib.request; r=urllib.request.urlopen("http://127.0.0.1:5000/webhook", timeout=5); print("inside_bot_status=",r.status,"inside_bot_body=",r.read(320).decode(errors="replace"))' 2>&1 | head -c 900; echo
          echo '---PRIMARY PROVIDER CONFIG PRESENCE (NOT VALUES)---'
          docker exec bot_backend python -c 'import os; keys=("WHATSAPP_PROVIDER","META_ACCESS_TOKEN","META_PHONE_NUMBER_ID","META_APP_SECRET","META_VERIFY_TOKEN","EVO_API_URL"); print("provider=",os.getenv("WHATSAPP_PROVIDER","unset")); [print(k+"_present=",bool(os.getenv(k))) for k in keys if k!="WHATSAPP_PROVIDER"]' 2>&1 | head -c 900; echo
          echo '---META GRAPH API AUTH TEST, NO MESSAGES SENT---'
          docker exec bot_backend python -c 'import os, urllib.request, urllib.error; phone=os.getenv("META_PHONE_NUMBER_ID",""); token=os.getenv("META_ACCESS_TOKEN",""); version=os.getenv("META_GRAPH_VERSION","v23.0"); print("can_test_meta=",bool(phone and token)); req=urllib.request.Request("https://graph.facebook.com/"+version+"/"+phone+"?fields=id,display_phone_number",headers={"Authorization":"Bearer "+token}); print("meta_result=",urllib.request.urlopen(req,timeout=10).status if phone and token else "missing_credentials")' 2>&1 | tail -n 8 | sed -E 's/(Bearer |access_token=)[^ ]+/\1[REDACTED]/g' | head -c 900; echo
          echo '---LATEST PYTHON CRASH REASONS---'
          docker logs --tail 150 bot_backend 2>&1 | grep -E 'ModuleNotFoundError|ImportError|SyntaxError|IndentationError|AttributeError|TypeError|RuntimeError|Exception|Error|Traceback|File "/app/' | tail -n 20 || true
          echo '---ACTIVE PORT OWNER---'
          docker ps --filter publish=5000 --format 'name={{.Names}} status={{.Status}}'
          echo '---PRIMARY AND ACTIVE IMAGES---'
          docker inspect -f 'name={{.Name}} image={{.Config.Image}} cmd={{json .Config.Cmd}}' bot_backend 2>&1
          owner="$(docker ps --filter publish=5000 --format '{{.Names}}' | head -n 1)"
          if [ -n "$owner" ]; then
            docker inspect -f 'name={{.Name}} image={{.Config.Image}} cmd={{json .Config.Cmd}}' "$owner" 2>&1
            echo '---ACTIVE BOT PYTHON FUNCTIONS---'
            docker exec "$owner" python -c 'import bot_logic; print("has_handle_payment_flow=",hasattr(bot_logic,"handle_payment_flow")); print("function_names=",",".join(n for n in dir(bot_logic) if "payment" in n or "webhook" in n or "message" in n))' 2>&1 | tail -n 7
            echo '---ACTIVE BOT HEALTH---'
            docker exec "$owner" python -c 'import urllib.request;r=urllib.request.urlopen("http://127.0.0.1:5000/webhook",timeout=5);print(r.status,r.read(200).decode())' 2>&1 | tail -n 7
            echo '---ACTIVE BOT 24H ACTIVITY---'
            docker logs --since 24h --tail 10000 "$owner" 2>&1 | awk '/POST \/webhook/ {inbound++} /graph.facebook.com/ {outbound++} /ERROR|Traceback|Error enviando/ {errors++} END {printf "inbound=%d outbound=%d errors=%d\n",inbound,outbound,errors}'
          fi
          echo '---ACTIVE BOT RECENT ACTIVITY---'
          for window in 60m 10m; do
            docker logs --since "$window" --tail 5000 "$owner" 2>&1 | awk -v w="$window" '
              /POST \/webhook/ {inbound++}
              /graph.facebook.com/ {graph++}
              /graph.facebook.com.*200 OK/ {sent_ok++}
              /graph.facebook.com.*(400|401|403|429|500)/ {sent_error++}
              /ERROR|Traceback|Error enviando/ {error++}
              END {printf "window=%s inbound=%d graph=%d sent_ok=%d sent_error=%d errors=%d\n",w,inbound,graph,sent_ok,sent_error,error}'
          done
          echo '---RECENT WEBHOOK AND SEND ACTIVITY COUNTS---'
          docker logs --since 60m --tail 2000 bot_backend 2>&1 | awk '
          /POST \/webhook/ {webhooks++}
          /graph.facebook.com/ {graph++}
          /HTTP\/1.1 200 OK/ {ok++}
          /401|403|400 Bad Request|500 Internal Server Error/ {errors++}
          /ERROR|Traceback|Exception|Error enviando/ {critical++}
          END {printf "webhook_requests=%d graph_requests=%d http_200_lines=%d error_lines=%d critical_lines=%d\n", webhooks, graph, ok, errors, critical}'
          echo '---FINAL PRIMARY LONGER HEALTH CHECK---'
          docker inspect -f 'primary_status={{.State.Status}} restart_count={{.RestartCount}} started={{.State.StartedAt}}' bot_backend
          docker exec bot_backend python -c 'import bot_logic,bot_presentation,urllib.request,os; assert callable(bot_logic.handle_payment_flow); r=urllib.request.urlopen("http://127.0.0.1:5000/webhook",timeout=5); print("production_functions_ok=1 internal_webhook_status=",r.status,"meta_provider=",os.getenv("WHATSAPP_PROVIDER","unset"),"meta_credentials_present=",bool(os.getenv("META_ACCESS_TOKEN") and os.getenv("META_PHONE_NUMBER_ID")))' 2>&1 | tail -n 5
          echo '---FINAL PUBLIC ROUTE CHECK---'
          curl -sS -m 8 -w ' public_http_code=%{http_code}\n' http://127.0.0.1:5000/webhook | head -c 500; echo
          echo '---2026-11-17 SERVICE STATUS---'
          date -u '+server_utc=%Y-%m-%dT%H:%M:%SZ'
          docker ps --filter publish=5000 --format 'listener={{.Names}} age={{.Status}}'
          docker inspect -f 'primary={{.State.Status}} restarts={{.RestartCount}}' bot_backend 2>/dev/null || true
          echo '---CURRENT MESSAGE FLOW 15M / 60M---'
          listener="$(docker ps --filter publish=5000 --format '{{.Names}}' | head -n 1)"
          if [ -n "$listener" ]; then
            for window in 15m 60m; do
              docker logs --since "$window" --tail 15000 "$listener" 2>&1 | awk -v w="$window" '
                /POST \/webhook/ {incoming++}
                /POST \/webhook.*200/ {webhook_ok++}
                /graph.facebook.com.*messages/ {sending++}
                /graph.facebook.com.*200 OK/ {send_ok++}
                /graph.facebook.com.*(400|401|403|429|500)/ {send_fail++}
                /Error enviando|ERROR|Traceback|Exception/ {errors++}
                END {printf "window=%s incoming=%d webhook_ok=%d sending=%d send_ok=%d send_fail=%d errors=%d\n",w,incoming,webhook_ok,sending,send_ok,send_fail,errors}'
            done
            echo '---ACTIVE BOT LAST ERRORS (NO MESSAGE BODIES)---'
            docker logs --since 4h --tail 2500 "$listener" 2>&1 | grep -E '(Error enviando WhatsApp|Meta WhatsApp no está configurado|HTTP Request: POST https://graph.facebook.com/.*(400|401|403|429)|Traceback)' | tail -n 12 | sed -E 's/[0-9]{9,15}/[ID]/g' || true
          fi
          echo '---DNS AND INTERNET PATH CHECK---'
          echo 'host_resolver:'
          grep -E '^nameserver|^search' /etc/resolv.conf || true
          echo 'host_graph_dns:'
          timeout 8 getent ahostsv4 graph.facebook.com | head -n 3 || true
          echo 'host_graph_https:'
          curl -sS -m 10 -o /dev/null -w 'http=%{http_code} remote=%{remote_ip}\n' https://graph.facebook.com/ 2>&1 | head -n 3 || true
          echo '---ACTIVE LISTENER DNS---'
          docker exec "$listener" sh -c "grep '^nameserver' /etc/resolv.conf" 2>&1 || true
          docker exec "$listener" python -c 'import socket; print("graph_dns=", socket.getaddrinfo("graph.facebook.com",443,type=socket.SOCK_STREAM)[0][4][0])' 2>&1 | tail -n 3 || true
          echo '---PRIMARY DNS---'
          docker exec bot_backend sh -c "grep '^nameserver' /etc/resolv.conf" 2>&1 || true
          docker exec bot_backend python -c 'import socket; print("graph_dns=", socket.getaddrinfo("graph.facebook.com",443,type=socket.SOCK_STREAM)[0][4][0])' 2>&1 | tail -n 3 || true
          echo '---DOCKER NETWORK SETTINGS---'
          docker inspect -f 'name={{.Name}} mode={{.HostConfig.NetworkMode}}' "$listener" bot_backend
          echo '---ACTIVE META API TOKEN STATUS (READ ONLY)---'
          docker exec "$listener" python -c 'import os,httpx; t=os.getenv("META_ACCESS_TOKEN",""); p=os.getenv("META_PHONE_NUMBER_ID",""); v=os.getenv("META_GRAPH_VERSION","v23.0"); print("has_meta_credentials=",bool(t and p)); r=httpx.get("https://graph.facebook.com/"+v+"/"+p,params={"fields":"id"},headers={"Authorization":"Bearer "+t},timeout=10) if t and p else None; print("meta_http_status=",r.status_code if r is not None else "not_tested"); print("meta_error_code=",r.json().get("error",{}).get("code") if r is not None and r.status_code>=400 else "none")' 2>&1 | tail -n 5
          echo '---ACTIVE RECENT SEND STATUS---'
          docker logs --since 12h --tail 5000 "$listener" 2>&1 | grep -E 'HTTP Request: POST https://graph.facebook.com/.*messages' | tail -n 8 | sed -E 's/[0-9]{10,15}/[ID]/g' || true
          echo '---PUBLIC DOMAIN WEBHOOK HEADERS---'
          curl -sS -m 12 -o /dev/null -w 'public_domain_http=%{http_code} remote_ip=%{remote_ip}\n' https://wifirapidito.com/webhook 2>&1 | head -n 3
          echo '---EXTERNAL WEBHOOK ROUTING---'
          curl -sS -m 10 -D /tmp/rapidito_headers.txt -o /tmp/rapidito_body.txt https://wifirapidito.com/webhook || true
          grep -iE '^(HTTP/|content-type:|location:|server:)' /tmp/rapidito_headers.txt | head -n 8 || true
          head -c 130 /tmp/rapidito_body.txt 2>/dev/null | tr '\n' ' '; echo
          echo '---WEBHOOK VALIDATION RESPONSE CLASS---'
          curl -sS -m 10 -o /dev/null -w 'invalid_verify_http=%{http_code}\n' 'https://wifirapidito.com/webhook?hub.mode=subscribe&hub.verify_token=invalid&hub.challenge=check' || true
          echo '---LAST INBOUND TIMESTAMPS---'
          docker logs --since 48h --tail 25000 "$listener" 2>&1 | grep 'POST /webhook' | tail -n 8 | cut -c 1-24 || true
          echo '---LISTENING TCP PORTS---'
          ss -lnt | grep -E '(:80 |:443 |:5000 |:8080 )' | head -n 12 || true
          echo '---HTTPS 443 PROCESS---'
          ss -lntp | grep ':443 ' | head -n 8 || true
          echo '---PROXY SERVICES---'
          docker ps --format 'name={{.Names}} image={{.Image}} ports={{.Ports}}' | grep -Ei 'nginx|caddy|traefik|proxy|cloudflared|tunnel' | head -n 15 || true
          echo '---REVERSE PROXY SERVER NAMES---'
          if command -v nginx >/dev/null 2>&1; then
            nginx -T 2>/dev/null | grep -E 'server_name|proxy_pass|webhook' | head -n 35 || true
          fi
          echo '---LAST WEBHOOK EVENT TIMES---'
          docker logs --timestamps --since 48h --tail 25000 "$listener" 2>&1 | grep 'POST /webhook' | tail -n 10 | cut -c 1-31 || true
          echo '---LAST META SEND EVENT TIMES---'
          docker logs --timestamps --since 48h --tail 25000 "$listener" 2>&1 | grep 'graph.facebook.com/' | tail -n 10 | cut -c 1-31 || true
          echo '---WHO LISTENS ON 443?---'
          docker ps --filter publish=443 --format 'https_container={{.Names}} image={{.Image}}' | head -n 8
          echo '---LOCAL HTTPS SITE CONFIGURATION FILE NAMES---'
          if [ -d /usr/local/lsws/conf ]; then
            grep -RilE 'webhook|127.0.0.1:5000|localhost:5000' /usr/local/lsws/conf --include='*.conf' 2>/dev/null | head -n 20 || true
          fi
          echo '---POTENTIAL PUBLIC BOT DOMAINS---'
          for host in bot.wifirapidito.com api.wifirapidito.com whatsapp.wifirapidito.com; do
            ip="$(getent ahostsv4 "$host" | head -n 1 | awk '{print $1}')"
            if [ -n "$ip" ]; then echo "$host DNS_RESOLVES=1"; else echo "$host DNS_RESOLVES=0"; fi
          done
          echo '---WEBHOOK REQUEST SOURCE GROUPS---'
          docker logs --since 24h --tail 20000 "$listener" 2>&1 | grep 'POST /webhook' | awk '{print $2}' | cut -d: -f1 | sort | uniq -c | sort -rn | head -n 8
          echo '---ACTUAL WEBHOOK DOMAIN EXTERNAL HEALTH---'
          for endpoint in 'https://webhook.wifirapidito.com/webhook' 'https://webhook.wifirapidito.com/'; do
            curl -sS -m 12 -D /tmp/rapidito_webhook_header.txt -o /tmp/rapidito_webhook_body.txt -w 'http=%{http_code} tls=%{ssl_verify_result} remote=%{remote_ip}\n' "$endpoint" 2>&1 | head -n 3
            grep -iE '^(HTTP/|content-type:|location:)' /tmp/rapidito_webhook_header.txt | head -n 4 || true
            head -c 180 /tmp/rapidito_webhook_body.txt 2>/dev/null | tr '\n' ' '; echo
          done
          echo '---ACTUAL WEBHOOK VERIFY TOKEN RESPONSE---'
          curl -sS -m 12 -o /dev/null -w 'invalid_token_http=%{http_code}\n' 'https://webhook.wifirapidito.com/webhook?hub.mode=subscribe&hub.verify_token=invalid&hub.challenge=test' || true
          echo '---VHOST PROXY CONFIGURATION---'
          grep -nEi 'rewrite|proxy|webhook|vhDomain|extprocessor|address|context|location|docRoot|vhRoot' /usr/local/lsws/conf/vhosts/webhook.wifirapidito.com/vhost.conf | head -n 60 || true
          echo '---DONE---'
          REMOTE
