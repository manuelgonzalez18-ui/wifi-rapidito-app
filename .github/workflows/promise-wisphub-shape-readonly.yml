name: Promise WispHub Shape Readonly

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/promise-wisphub-shape-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_readonly
          chmod 600 ~/.ssh/hostinger_readonly
          ssh-keygen -y -f ~/.ssh/hostinger_readonly >/dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hostinger_readonly -p 65002 -o BatchMode=yes -o ConnectTimeout=15 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'echo SSH_OK'

      - name: Inspect promise payload keys without secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="/home/$HOSTINGER_USER/domains/wifirapidito.com/public_html"
          ssh -i ~/.ssh/hostinger_readonly -p 65002 -o BatchMode=yes -o ConnectTimeout=15 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "cd '$REMOTE_BASE' && php -d display_errors=0 -r 'require \"config_wisphub.php\"; \$u=rtrim(WISPHUB_API_URL,\"/\").\"/promesas-de-pago/?limit=300\"; \$c=curl_init(\$u); curl_setopt_array(\$c,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_HTTPHEADER=>[\"Authorization: Api-Key \".WISPHUB_TOKEN,\"Accept: application/json\"],CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>20,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2]); \$b=curl_exec(\$c); \$h=(int)curl_getinfo(\$c,CURLINFO_HTTP_CODE); curl_close(\$c); echo \"http=\".\$h.PHP_EOL; \$d=json_decode((string)\$b,true); if(!is_array(\$d)){echo \"json=invalid\".PHP_EOL; exit;} echo \"top_keys=\".implode(\",\",array_keys(\$d)).PHP_EOL; \$r=is_array(\$d[\"results\"]??null)?\$d[\"results\"]:(array_is_list(\$d)?\$d:[]); echo \"rows=\".count(\$r).PHP_EOL; if(\$r&&is_array(\$r[0])) echo \"row_keys=\".implode(\",\",array_keys(\$r[0])).PHP_EOL; foreach(\$r as \$x){if(!is_array(\$x))continue; \$e=strtolower((string)json_encode(\$x,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)); if(strpos(\$e,\"leidycartagena\")===false)continue; \$s=[]; foreach([\"id\",\"id_promesa\",\"id_factura\",\"fecha_limite\",\"fecha_limite_de_pago\",\"fecha\",\"estado\",\"status\",\"cumplida\",\"pagada\",\"cliente\",\"usuario\",\"servicio\",\"id_servicio\"] as \$k){if(array_key_exists(\$k,\$x))\$s[\$k]=\$x[\$k];} echo \"match=\".json_encode(\$s,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;}'"
