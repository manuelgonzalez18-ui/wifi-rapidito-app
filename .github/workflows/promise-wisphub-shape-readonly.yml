name: Promise WispHub Shape Readonly

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/promise-wisphub-shape-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST" && test -n "$HOSTINGER_USER" && test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect promise records without writes
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger -p 65002 -o BatchMode=yes "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/wifirapidito.com/public_html"
          cd "$APP"
          php -r '
            require "config_wisphub.php";
            $hosts=["app"=>"https://api.wisphub.app/api","net"=>"https://api.wisphub.net/api"];
            foreach($hosts as $label=>$base){
              $url=$base."/promesas-de-pago/?limit=300";
              $ch=curl_init($url);
              curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_HTTPHEADER=>["Authorization: Api-Key ".WISPHUB_TOKEN,"Accept: application/json"],CURLOPT_TIMEOUT=>20]);
              $body=curl_exec($ch); $code=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE); curl_close($ch);
              echo strtoupper($label)."_HTTP=$code\n";
              if($code!==200||$body===false) continue;
              $d=json_decode($body,true);
              $rows=is_array($d["results"]??null)?$d["results"]:(is_array($d)&&array_is_list($d)?$d:[]);
              echo strtoupper($label)."_TOP_KEYS=".(is_array($d)?implode(",",array_keys($d)):"NONE")."\n";
              echo strtoupper($label)."_ROWS=".count($rows)."\n";
              echo strtoupper($label)."_ROW_KEYS=".($rows&&is_array($rows[0])?implode(",",array_keys($rows[0])):"NONE")."\n";
              $matches=[];
              foreach($rows as $r){if(!is_array($r)||stripos(json_encode($r),"leidycartagena")===false)continue;$safe=[];foreach(["id","id_promesa","id_factura","fecha_limite","fecha","estado","status","cumplida","pagada","usuario","servicio","id_servicio"] as $k){if(array_key_exists($k,$r))$safe[$k]=$r[$k];}$matches[]=$safe;}
              echo strtoupper($label)."_LEIDY_MATCHES=".json_encode($matches,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
            }
          '
          REMOTE
