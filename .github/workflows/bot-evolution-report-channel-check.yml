name: Bot Evolution Report Channel Check

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-evolution-report-channel-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_HOST: 76.13.100.2
      SSH_PORT: '22'
      TARGET_USER: root
      EXPECTED_HOST_FP: SHA256:bO3AdnzChlN7ZSaozrNfs3C0wLT6cvMyI4Jg1D78qYQ
      NEW_ADMIN_REPORT_NUMBER: '584242268245'
    steps:
      - name: Configure verified SSH
        env:
          BOT_VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$BOT_VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keygen -y -f ~/.ssh/key >/dev/null
          : > ~/.ssh/known_hosts
          for attempt in {1..6}; do
            if ssh-keyscan -T 8 -t ed25519 -p "$SSH_PORT" "$TARGET_HOST" > ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then
              break
            fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          actual_fp=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | head -1)
          test "$actual_fp" = "$EXPECTED_HOST_FP"

      - name: Update admin report number in production
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          NEW_ADMIN_REPORT_NUMBER='584242268245'
          test "$(docker inspect -f '{{.State.Running}}' bot_backend)" = true
          image=$(docker inspect -f '{{.Config.Image}}' bot_backend)
          restart=$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' bot_backend)
          network=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' bot_backend)
          test -n "$image"
          test -n "$network"

          current=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' bot_backend | sed -n 's/^ADMIN_REPORT_NUMBER=//p' | head -1)
          if [ "$current" = "$NEW_ADMIN_REPORT_NUMBER" ]; then
            echo 'ADMIN_REPORT_NUMBER_ALREADY_CORRECT=1'
          else
            envfile=$(mktemp /root/rapidito-env.XXXXXX)
            chmod 600 "$envfile"
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' bot_backend \
              | grep -v '^ADMIN_REPORT_NUMBER=' > "$envfile"
            printf 'ADMIN_REPORT_NUMBER=%s\n' "$NEW_ADMIN_REPORT_NUMBER" >> "$envfile"

            old_name="bot_backend_reportnum_$(date +%Y%m%d-%H%M%S)"
            docker rename bot_backend "$old_name"
            docker stop "$old_name" >/dev/null

            rollback() {
              docker rm -f bot_backend >/dev/null 2>&1 || true
              docker rename "$old_name" bot_backend >/dev/null 2>&1 || true
              docker start bot_backend >/dev/null 2>&1 || true
              rm -f "$envfile"
            }
            trap rollback ERR

            docker run -d \
              --name bot_backend \
              --restart "$restart" \
              --network "$network" \
              -p 5000:5000 \
              --env-file "$envfile" \
              "$image" >/dev/null

            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:5000/webhook 2>/dev/null | grep -q '4.0-bot-10-opciones'; then
                break
              fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:5000/webhook | grep -q '4.0-bot-10-opciones'
            actual=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' bot_backend | sed -n 's/^ADMIN_REPORT_NUMBER=//p' | head -1)
            test "$actual" = "$NEW_ADMIN_REPORT_NUMBER"
            printf '%s\n' "$old_name" > /root/rapidito-report-number-rollback-container
            rm -f "$envfile"
            trap - ERR
            echo 'ADMIN_REPORT_NUMBER_UPDATED=1'
          fi
          REMOTE

      - name: Check Evolution connection without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          envdump=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' bot_backend)
          api_key=$(printf '%s\n' "$envdump" | sed -n 's/^EVO_API_KEY=//p' | head -1)
          test -n "$api_key"

          code=$(curl -sS --max-time 10 -o /tmp/evo-instances.json -w '%{http_code}' \
            -H "apikey: $api_key" http://127.0.0.1:8080/instance/fetchInstances || true)
          echo "EVOLUTION_FETCH_HTTP=$code"
          test "$code" = 200

          state_code=$(curl -sS --max-time 10 -o /tmp/evo-state.json -w '%{http_code}' \
            -H "apikey: $api_key" http://127.0.0.1:8080/instance/connectionState/rapidito_bot || true)
          echo "EVOLUTION_STATE_HTTP=$state_code"
          if [ "$state_code" = 200 ]; then
            python3 - <<'PY'
          import json
          with open('/tmp/evo-state.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          instance = data.get('instance') if isinstance(data, dict) else {}
          if not isinstance(instance, dict):
              instance = {}
          state = instance.get('state') or (data.get('state') if isinstance(data, dict) else '') or (data.get('connectionStatus') if isinstance(data, dict) else '') or ''
          print('EVOLUTION_CONNECTION_STATE=' + str(state))
          PY
          else
            echo 'EVOLUTION_CONNECTION_STATE=unknown'
          fi
          REMOTE
