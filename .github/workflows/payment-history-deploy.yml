name: Payment History Deploy

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - 'public/proxy_payments.php'
      - 'public/proxy_invoices.php'
      - 'public/payment_registry_lib.php'
      - 'public/payment_history.php'
      - 'src/pages/Admin/PaymentHistory.jsx'
      - 'src/App.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - '.github/workflows/payment-history-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/proxy_payments.php'
      - 'public/proxy_invoices.php'
      - 'public/payment_registry_lib.php'
      - 'public/payment_history.php'
      - 'src/pages/Admin/PaymentHistory.jsx'
      - 'src/App.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - '.github/workflows/payment-history-deploy.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: payment-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate payment and invoice backend
        shell: bash
        run: |
          set -euo pipefail
          php -l public/payment_registry_lib.php
          php -l public/payment_history.php
          php -l public/proxy_payments.php
          php -l public/proxy_invoices.php
          php -r '$_SERVER["SCRIPT_FILENAME"]=""; require "public/payment_registry_lib.php"; if (payment_registry_reference_key("001234567890") !== "567890") exit(1); if (payment_registry_reference_key("567890") !== "567890") exit(2); echo "Reference normalization OK\n";'

      - name: Validate frontend
        run: |
          npx eslint src/App.jsx src/components/layout/Sidebar.jsx src/pages/Admin/PaymentHistory.jsx
          npm run build

      - name: Configure Hostinger SSH
        if: github.event_name == 'push'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy >/dev/null
          for i in 1 2 3; do
            ssh-keyscan -T 10 -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 2
          done
          test -s ~/.ssh/known_hosts

      - name: Backup portal and deploy payment feature
        if: github.event_name == 'push'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="/home/$HOSTINGER_USER/domains/wifirapidito.com/public_html"
          stamp="$(date +%Y%m%d-%H%M%S)"

          ssh -o ConnectTimeout=15 -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<REMOTE
          set -euo pipefail
          BASE="$REMOTE_BASE"
          mkdir -p "\$BASE/.portal-backups" "\$BASE/.frontend-backups" "\$BASE/assets"
          cd "\$BASE"
          files=()
          for file in proxy_payments.php proxy_invoices.php payment_registry_lib.php payment_history.php; do
            [[ -f "\$file" ]] && files+=("\$file")
          done
          if (( \${#files[@]} > 0 )); then
            tar -czf "\$BASE/.portal-backups/payment-feature-$stamp.tar.gz" "\${files[@]}"
          fi
          frontend=()
          [[ -f index.html ]] && frontend+=(index.html)
          [[ -d assets ]] && frontend+=(assets)
          if (( \${#frontend[@]} > 0 )); then
            tar -czf "\$BASE/.frontend-backups/payment-frontend-$stamp.tar.gz" "\${frontend[@]}"
          fi
          find "\$BASE/.portal-backups" -type f -name 'payment-feature-*.tar.gz' -mtime +14 -delete || true
          find "\$BASE/.frontend-backups" -type f -name 'payment-frontend-*.tar.gz' -mtime +14 -delete || true
          REMOTE

          for file in payment_registry_lib.php payment_history.php proxy_payments.php proxy_invoices.php; do
            scp -o ConnectTimeout=15 -i ~/.ssh/hostinger_deploy -P 65002 \
              "public/$file" \
              "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/$file.next"
            ssh -o ConnectTimeout=15 -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
              "php -l '$REMOTE_BASE/$file.next' >/dev/null && mv '$REMOTE_BASE/$file.next' '$REMOTE_BASE/$file'"
          done

          scp -o ConnectTimeout=15 -i ~/.ssh/hostinger_deploy -P 65002 -r \
            dist/assets/. \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/assets/"
          scp -o ConnectTimeout=15 -i ~/.ssh/hostinger_deploy -P 65002 \
            dist/index.html \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/index.html.next"
          ssh -o ConnectTimeout=15 -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mv '$REMOTE_BASE/index.html.next' '$REMOTE_BASE/index.html'"
          printf '%s\n' "$GITHUB_SHA" | ssh -o ConnectTimeout=15 -i ~/.ssh/hostinger_deploy -p 65002 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" "cat > '$REMOTE_BASE/payment-feature-version.txt'"

      - name: Verify public payment and invoice feature
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            PROXY="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/proxy_payments.php?health=$GITHUB_SHA" 2>/dev/null || true)"
            INVOICE_HEALTH="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/proxy_invoices.php?health=$GITHUB_SHA" 2>/dev/null || true)"
            INVOICE_412="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/proxy_invoices.php?id_servicio=412&nocache=$GITHUB_SHA" 2>/dev/null || true)"
            HISTORY="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/payment_history.php?health=$GITHUB_SHA" 2>/dev/null || true)"
            VERSION="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/payment-feature-version.txt?sha=$GITHUB_SHA" 2>/dev/null || true)"

            if grep -q '4.1-wisphub-register-fix' <<<"$PROXY" \
              && grep -q '4.0-wisphub-saldo' <<<"$INVOICE_HEALTH" \
              && grep -q '"id_factura":8990' <<<"$INVOICE_412" \
              && grep -q '"total":25' <<<"$INVOICE_412" \
              && grep -q '1.0-payment-history' <<<"$HISTORY" \
              && [[ "$VERSION" == "$GITHUB_SHA" ]]; then
              echo 'Payment and WispHub invoice features deployed and verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Public payment/invoice verification failed.'
          echo "proxy=$PROXY"
          echo "invoice_health=$INVOICE_HEALTH"
          echo "invoice_412=$INVOICE_412"
          exit 1

      - name: Publish deployment status
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Payment History Deploy',
              description: 'Payments and WispHub invoices deployed',
            });