name: Rapidito Fix HTTPS Webhook Proxy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rapidito-fix-webhook-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to authorized Rapidito VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.BOT_VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
          VPS_PORT_RAW: ${{ secrets.BOT_VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_SSH_KEY_B64"
          VPS_PORT="$(printf '%s' "$VPS_PORT_RAW" | tr -d '[:space:]')"
          if ! [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || [ "$VPS_PORT" -lt 1 ] || [ "$VPS_PORT" -gt 65535 ]; then VPS_PORT=22; fi
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/rapidito_vps
          chmod 600 ~/.ssh/rapidito_vps
          ssh-keygen -y -f ~/.ssh/rapidito_vps >/dev/null
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "RAPIDITO_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "RAPIDITO_PORT=$VPS_PORT" >> "$GITHUB_ENV"

      - name: Configure explicit LiteSpeed proxy upstream and verify live
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rapidito_vps -p "$RAPIDITO_PORT" -o BatchMode=yes -o ConnectTimeout=15 "root@$RAPIDITO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          vhost=/usr/local/lsws/conf/vhosts/webhook.wifirapidito.com/vhost.conf
          control=/usr/local/lsws/bin/lswsctrl
          backups=/root/rapidito-webhook-proxy-backups
          test -f "$vhost" && test -x "$control"
          curl -fsS -m 5 http://127.0.0.1:5000/webhook | grep -q 'Webhook receiver is active'
          mkdir -p "$backups"
          backup="$backups/vhost-explicit-upstream-$(date -u +%Y%m%dT%H%M%SZ).conf"
          cp -p "$vhost" "$backup"
          echo 'BACKUP_CREATED=1'
          success=0
          revert() {
            if [ "$success" -ne 1 ]; then
              cp -p "$backup" "$vhost"
              "$control" restart >/dev/null 2>&1 || true
              echo 'VHOST_ROLLED_BACK=1'
            fi
          }
          trap revert EXIT
          python3 - "$vhost" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          content=p.read_text()
          if 'extprocessor rapidito_webhook_api' in content or 'context /webhook {' in content:
              raise SystemExit('Existing proxy configuration detected; refusing to duplicate')
          blocks="""

          # Wifi Rapidito: dedicated WhatsApp Meta webhook reverse proxy.
          extprocessor rapidito_webhook_api {
            type                    proxy
            address                 127.0.0.1:5000
            maxConns                100
            initTimeout             30
            retryTimeout            1
            respBuffer              0
          }

          context /webhook {
            type                    proxy
            handler                 rapidito_webhook_api
            addDefaultCharset       off
          }

          context /webhook-whatsapp {
            type                    proxy
            handler                 rapidito_webhook_api
            addDefaultCharset       off
          }
          """
          p.write_text(content.rstrip()+"\n"+blocks)
          print('EXPLICIT_PROXY_CONFIG_WRITTEN=1')
          PY
          echo 'RELOADING_LITESPEED_GRACEFULLY=1'
          "$control" restart >/tmp/rapidito-webhook-graceful.log 2>&1
          passed=0
          for attempt in $(seq 1 9); do
            status="$(curl -sS -m 8 -o /tmp/rapidito-public-hook.json -w '%{http_code}' https://webhook.wifirapidito.com/webhook 2>/dev/null || true)"
            if [ "$status" = 200 ] && grep -q 'Webhook receiver is active' /tmp/rapidito-public-hook.json; then
              passed=1
              break
            fi
            sleep 2
          done
          echo "PUBLIC_WEBHOOK_STATUS=$status"
          if [ "$passed" -ne 1 ]; then exit 31; fi
          invalid="$(curl -sS -m 8 -o /dev/null -w '%{http_code}' 'https://webhook.wifirapidito.com/webhook?hub.mode=subscribe&hub.verify_token=invalid&hub.challenge=check' || true)"
          echo "INVALID_TOKEN_STATUS=$invalid"
          if [ "$invalid" != 403 ]; then exit 32; fi
          success=1
          trap - EXIT
          echo 'WEBHOOK_PROXY_RESTORED=1'
          echo "UPSTREAM_OWNER=$(docker ps --filter publish=5000 --format '{{.Names}}' | head -n 1)"
          REMOTE
