name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed frontend files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${GITHUB_BASE_REF:-main}"
            git fetch origin "$BASE" --depth=1
            DIFF_BASE="origin/$BASE"
          else
            DIFF_BASE="HEAD^"
          fi

          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$DIFF_BASE" HEAD -- src | grep -E '\.(js|jsx)$' || true)
          if (( ${#FILES[@]} == 0 )); then
            echo "No changed frontend JavaScript files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${FILES[@]}"
          npx eslint "${FILES[@]}"

      - name: Build
        run: npm run build

      - name: Upload Hostinger dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # Production deploy is intentionally paused while the live Banesco
      # payment form is recovered and brought back into source control.
      - name: Configure Hostinger SSH for recovery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[restore-production]')
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy > /dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hostinger_deploy -p 65002 -o BatchMode=yes -o ConnectTimeout=15 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'echo "Hostinger SSH recovery connection verified."'

      - name: Restore last pre-deploy Hostinger frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[restore-production]')
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domains/wifirapidito.com/public_html"
          BACKUPS="$BASE/.frontend-backups"
          latest="$(ls -1t "$BACKUPS"/frontend-*.tar.gz 2>/dev/null | head -n 1 || true)"
          test -n "$latest"
          test -s "$latest"
          cd "$BASE"
          tar -xzf "$latest"
          test -s "$BASE/index.html"
          test -d "$BASE/assets"
          echo "Restored frontend backup: $(basename "$latest")"
          REMOTE

      - name: Download recovered production snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[restore-production]')
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$(ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            'ls -1t "$HOME"/domains/wifirapidito.com/public_html/.frontend-backups/frontend-*.tar.gz 2>/dev/null | head -n 1')"
          test -n "$LATEST"
          scp -i ~/.ssh/hostinger_deploy -P 65002 \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$LATEST" \
            production-frontend-backup.tar.gz
          test -s production-frontend-backup.tar.gz

      - name: Upload recovered production snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[restore-production]')
        uses: actions/upload-artifact@v4
        with:
          name: recovered-production-frontend-${{ github.sha }}
          path: production-frontend-backup.tar.gz
          if-no-files-found: error
          retention-days: 14
