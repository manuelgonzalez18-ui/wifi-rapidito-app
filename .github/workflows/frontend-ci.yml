name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed frontend files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${GITHUB_BASE_REF:-main}"
            git fetch origin "$BASE" --depth=1
            DIFF_BASE="origin/$BASE"
          else
            DIFF_BASE="HEAD^"
          fi

          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$DIFF_BASE" HEAD -- src | grep -E '\.(js|jsx)$' || true)
          if (( ${#FILES[@]} == 0 )); then
            echo "No changed frontend JavaScript files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${FILES[@]}"
          npx eslint "${FILES[@]}"

      - name: Build
        run: npm run build

      - name: Upload Hostinger dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Configure Hostinger SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy > /dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hostinger_deploy -p 65002 -o BatchMode=yes -o ConnectTimeout=15 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'echo "Hostinger SSH connection verified."'

      - name: Backup current Hostinger frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domains/wifirapidito.com/public_html"
          LIVE="$BASE"
          BACKUPS="$BASE/.frontend-backups"
          mkdir -p "$LIVE/assets" "$BACKUPS"
          stamp="$(date +%Y%m%d-%H%M%S)"
          cd "$LIVE"
          items=()
          [[ -f index.html ]] && items+=(index.html)
          [[ -d assets ]] && items+=(assets)
          if (( ${#items[@]} > 0 )); then
            tar -czf "$BACKUPS/frontend-$stamp.tar.gz" "${items[@]}"
          fi
          find "$BACKUPS" -type f -name 'frontend-*.tar.gz' -mtime +14 -delete || true
          REMOTE

      - name: Deploy frontend assets to Hostinger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="/home/$HOSTINGER_USER/domains/wifirapidito.com/public_html"

          # Upload generated JS/CSS/assets first. Existing PHP/backend files are preserved.
          scp -i ~/.ssh/hostinger_deploy -P 65002 -r \
            dist/assets/. \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/assets/"

          # Switch root index.html only after every referenced asset is present.
          scp -i ~/.ssh/hostinger_deploy -P 65002 \
            dist/index.html \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/index.html.next"

          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mv '$REMOTE_BASE/index.html.next' '$REMOTE_BASE/index.html'"

      - name: Verify Hostinger deployment files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="/home/$HOSTINGER_USER/domains/wifirapidito.com/public_html"
          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "test -s '$REMOTE_BASE/index.html' && test -d '$REMOTE_BASE/assets' && grep -q '/assets/' '$REMOTE_BASE/index.html' && echo 'Hostinger root frontend deployment verified.'"
