name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed frontend files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE" --depth=1
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "origin/$BASE" HEAD -- src | grep -E '\.(js|jsx)$' || true)
          if (( ${#FILES[@]} == 0 )); then
            echo "No changed frontend JavaScript files to lint."
            exit 0
          fi
          printf 'Linting %s\n' "${FILES[@]}"
          npx eslint "${FILES[@]}"

      - name: Lint frontend source on main
        if: github.event_name == 'push'
        run: npx eslint src

      - name: Build
        run: npm run build
