name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed frontend files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${GITHUB_BASE_REF:-main}"
            git fetch origin "$BASE" --depth=1
            DIFF_BASE="origin/$BASE"
          else
            DIFF_BASE="HEAD^"
          fi

          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$DIFF_BASE" HEAD -- src | grep -E '\.(js|jsx)$' || true)
          if (( ${#FILES[@]} == 0 )); then
            echo "No changed frontend JavaScript files to lint."
          else
            printf 'Linting %s\n' "${FILES[@]}"
            npx eslint "${FILES[@]}"
          fi

      - name: Validate PHP syntax
        run: |
          php -l public/login_wisphub.php
          php -l public/staff_auth.php
          php -l public/support_dashboard.php

      - name: Build
        run: npm run build

      - name: Upload Hostinger dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Configure Hostinger SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy > /dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hostinger_deploy -p 65002 -o BatchMode=yes -o ConnectTimeout=15 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'echo "Hostinger SSH connection verified."'

      - name: Backup current Hostinger frontend and portal backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domains/wifirapidito.com/public_html"
          FRONTEND_BACKUPS="$BASE/.frontend-backups"
          PORTAL_BACKUPS="$BASE/.portal-backups"
          mkdir -p "$BASE/assets" "$FRONTEND_BACKUPS" "$PORTAL_BACKUPS"
          stamp="$(date +%Y%m%d-%H%M%S)"
          cd "$BASE"
          items=()
          [[ -f index.html ]] && items+=(index.html)
          [[ -d assets ]] && items+=(assets)
          if (( ${#items[@]} > 0 )); then
            tar -czf "$FRONTEND_BACKUPS/frontend-$stamp.tar.gz" "${items[@]}"
            echo "Created frontend backup: frontend-$stamp.tar.gz"
          fi
          backend_items=()
          for file in login_wisphub.php staff_auth.php support_dashboard.php; do
            [[ -f "$file" ]] && backend_items+=("$file")
          done
          if (( ${#backend_items[@]} > 0 )); then
            tar -czf "$PORTAL_BACKUPS/portal-backend-$stamp.tar.gz" "${backend_items[@]}"
            echo "Created portal backend backup: portal-backend-$stamp.tar.gz"
          fi
          find "$FRONTEND_BACKUPS" -type f -name 'frontend-*.tar.gz' -mtime +14 -delete || true
          find "$PORTAL_BACKUPS" -type f -name 'portal-backend-*.tar.gz' -mtime +14 -delete || true
          REMOTE

      - name: Deploy frontend and portal backend to Hostinger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="/home/$HOSTINGER_USER/domains/wifirapidito.com/public_html"

          for file in login_wisphub.php staff_auth.php support_dashboard.php; do
            test -s "dist/$file"
          done

          scp -i ~/.ssh/hostinger_deploy -P 65002 -r \
            dist/assets/. \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/assets/"

          for file in login_wisphub.php staff_auth.php support_dashboard.php; do
            scp -i ~/.ssh/hostinger_deploy -P 65002 \
              "dist/$file" \
              "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/$file.next"
            ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
              "php -l '$REMOTE_BASE/$file.next' >/dev/null && mv '$REMOTE_BASE/$file.next' '$REMOTE_BASE/$file'"
          done

          scp -i ~/.ssh/hostinger_deploy -P 65002 \
            dist/index.html \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/index.html.next"

          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mv '$REMOTE_BASE/index.html.next' '$REMOTE_BASE/index.html'"

          printf '%s\n' "$GITHUB_SHA" | ssh -i ~/.ssh/hostinger_deploy -p 65002 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" "cat > '$REMOTE_BASE/frontend-version.txt'"

      - name: Verify Hostinger deployment files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="/home/$HOSTINGER_USER/domains/wifirapidito.com/public_html"
          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "test -s '$REMOTE_BASE/index.html' && test -d '$REMOTE_BASE/assets' && test -s '$REMOTE_BASE/frontend-version.txt' && test -s '$REMOTE_BASE/login_wisphub.php' && test -s '$REMOTE_BASE/staff_auth.php' && test -s '$REMOTE_BASE/support_dashboard.php' && php -l '$REMOTE_BASE/login_wisphub.php' >/dev/null && php -l '$REMOTE_BASE/staff_auth.php' >/dev/null && php -l '$REMOTE_BASE/support_dashboard.php' >/dev/null && grep -q '/assets/' '$REMOTE_BASE/index.html' && grep -q '5.0-resilient' '$REMOTE_BASE/login_wisphub.php' && grep -q '2.1-admin-reset' '$REMOTE_BASE/staff_auth.php' && grep -q '1.1-support-permissions' '$REMOTE_BASE/support_dashboard.php' && echo 'Hostinger portal deployment verified.'"

      - name: Verify public Hostinger deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            LIVE_SHA="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/frontend-version.txt?sha=$GITHUB_SHA" 2>/dev/null || true)"
            LOGIN_HEALTH="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/login_wisphub.php?health=$GITHUB_SHA" 2>/dev/null || true)"
            SUPPORT_HEALTH="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/support_dashboard.php?health=$GITHUB_SHA" 2>/dev/null || true)"
            STAFF_HEALTH="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/staff_auth.php?health=$GITHUB_SHA" 2>/dev/null || true)"
            if [[ "$LIVE_SHA" == "$GITHUB_SHA" ]] \
              && grep -q '5.0-resilient' <<<"$LOGIN_HEALTH" \
              && grep -q '1.1-support-permissions' <<<"$SUPPORT_HEALTH" \
              && grep -q '2.1-admin-reset' <<<"$STAFF_HEALTH"; then
              echo "Public Hostinger frontend and portal backend verified."
              exit 0
            fi
            echo "Waiting for public deployment propagation ($attempt/12)..."
            sleep 5
          done
          echo "Public deployment verification failed for $GITHUB_SHA"
          exit 1

      - name: Publish Hostinger deployment status
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Hostinger Deploy',
              description: 'Frontend and protected portal backend deployed and publicly verified',
            });
