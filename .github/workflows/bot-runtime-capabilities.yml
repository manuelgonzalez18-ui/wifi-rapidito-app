name: Bot Runtime Capabilities

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-runtime-capabilities.yml'
      - 'vps/LIVE_RUNTIME_CAPABILITIES_TRIGGER'

permissions:
  contents: read

jobs:
  capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_HOST: 76.13.100.2
      SSH_PORT: '22'
      TARGET_USER: root
    steps:
      - name: Configure SSH
        env:
          BOT_VPS_SSH_KEY_B64: ${{ secrets.BOT_VPS_SSH_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_VPS_SSH_KEY_B64"
          echo 'SECRET_PRESENT=1'

          mkdir -p ~/.ssh
          printf '%s' "$BOT_VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/key
          chmod 600 ~/.ssh/key
          echo 'KEY_DECODE_OK=1'
          ssh-keygen -y -f ~/.ssh/key >/dev/null
          echo 'KEY_PARSE_OK=1'

          if timeout 8 bash -c "</dev/tcp/$TARGET_HOST/$SSH_PORT" 2>/dev/null; then
            echo 'TCP22_OK=1'
          else
            echo 'TCP22_OK=0'
          fi

          set +e
          timeout 10 ssh-keyscan -T 5 -p "$SSH_PORT" "$TARGET_HOST" > ~/.ssh/known_hosts 2>/tmp/keyscan.err
          keyscan_rc=$?
          set -e
          echo "KEYSCAN_RC=$keyscan_rc"
          if [[ -s ~/.ssh/known_hosts ]]; then
            echo 'KEYSCAN_KEYS=1'
            ssh-keygen -lf ~/.ssh/known_hosts -E sha256 || true
          else
            echo 'KEYSCAN_KEYS=0'
            sed -n '1,10p' /tmp/keyscan.err || true
          fi

      - name: Test SSH authentication
        shell: bash
        run: |
          set +e
          out=$(mktemp)
          ssh -vv -i ~/.ssh/key -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$TARGET_USER@$TARGET_HOST" 'echo SSH_AUTH_OK=1; hostname; whoami' >"$out" 2>&1
          rc=$?
          grep -E 'SSH_AUTH_OK|Authentications that can continue|Offering public key|Server accepts key|Permission denied|Connection reset|Connection timed out|Connection refused|kex_exchange|Remote protocol version|Local version string|^root$|srv1293381' "$out" || true
          echo "SSH_TEST_RC=$rc"
          exit "$rc"

      - name: Inspect Rapidito production read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$TARGET_USER@$TARGET_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/home/bot.local/public_html
          cd "$APP"
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"
          test -f docker-compose.yml
          test -f .env
          echo 'APP_LAYOUT_OK=1'
          docker --version
          docker compose version
          echo '--- COMPOSE PS ---'
          docker compose ps
          echo '--- DOCKER PS ---'
          docker ps --format 'NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}'
          echo '--- APP FILES ---'
          find . -maxdepth 1 -type f -printf '%f\n' | sort | grep -E '^(bot_|docker-compose|Dockerfile|requirements|\.env)' | sed -E 's/^\.env$/.env (present)/' || true
          echo '--- BOT HEALTH ---'
          curl -sS --max-time 5 -o /tmp/bot_health.txt -w 'BOT_HTTP=%{http_code}\n' http://127.0.0.1:5000/webhook || true
          head -c 300 /tmp/bot_health.txt 2>/dev/null || true
          echo
          echo '--- EVOLUTION ROOT ---'
          curl -sS --max-time 5 -o /tmp/evo_root.txt -w 'EVOLUTION_HTTP=%{http_code}\n' http://127.0.0.1:8080/ || true
          head -c 300 /tmp/evo_root.txt 2>/dev/null || true
          echo
          EVO_API_KEY=$(grep -m1 '^EVO_API_KEY=' .env | cut -d= -f2- | tr -d '\r' || true)
          WISPHUB_API_KEY=$(grep -m1 '^WISPHUB_API_KEY=' .env | cut -d= -f2- | tr -d '\r' || true)
          INSTANCE_NAME=$(grep -m1 '^INSTANCE_NAME=' .env | cut -d= -f2- | tr -d '\r' || true)
          [[ -n "$EVO_API_KEY" ]] && echo 'EVO_API_KEY=SET' || echo 'EVO_API_KEY=MISSING'
          [[ -n "$WISPHUB_API_KEY" ]] && echo 'WISPHUB_API_KEY=SET' || echo 'WISPHUB_API_KEY=MISSING'
          echo "INSTANCE_NAME=${INSTANCE_NAME:-rapidito_bot}"
          if [[ -n "$EVO_API_KEY" ]]; then
            code=$(curl -sS --max-time 8 -o /tmp/rapidito_instances.json -w '%{http_code}' -H "apikey: $EVO_API_KEY" http://127.0.0.1:8080/instance/fetchInstances || true)
            echo "EVOLUTION_INSTANCES_HTTP=$code"
            if [[ "$code" == "200" ]]; then
              grep -o '"instanceName"[^,}]*\|"state"[^,}]*\|"connectionStatus"[^,}]*' /tmp/rapidito_instances.json | head -30 || true
            fi
          fi
          REMOTE
