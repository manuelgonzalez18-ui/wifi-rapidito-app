name: Payment Registration Readonly

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/payment-registration-readonly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy >/dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts

      - name: Inspect payment registration state without writes
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domains/wifirapidito.com/public_html"
          PRIVATE="$(dirname "$BASE")/.wifi-rapidito-private"
          STORE="$PRIVATE/validated-payments.json"
          echo '=== Payment registry ==='
          if [ ! -f "$STORE" ]; then echo 'registry_present=no'; exit 0; fi
          echo 'registry_present=yes'
          php -r '
            $d=json_decode((string)file_get_contents($argv[1]),true); if(!is_array($d)){echo "registry_valid=no\n";exit;}
            echo "registry_valid=yes\nregistry_count=".count($d)."\n";
            $rows=array_values(array_filter($d,"is_array"));
            usort($rows,fn($a,$b)=>strcmp((string)($b["updated_at"]??""),(string)($a["updated_at"]??"")));
            foreach(array_slice($rows,0,5) as $i=>$r){
              echo "record_$i=".json_encode([
                "status"=>$r["status"]??"",
                "source"=>$r["source"]??"",
                "invoice_id"=>$r["invoice_id"]??"",
                "amount_bs"=>$r["amount_bs"]??"",
                "payment_date"=>$r["payment_date"]??"",
                "method"=>$r["payment_method"]??"",
                "registration_error"=>$r["registration_error"]??null,
                "created_at"=>$r["created_at"]??"",
                "updated_at"=>$r["updated_at"]??"",
                "validated_at"=>$r["validated_at"]??null
              ],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";
            }
          ' "$STORE"

          echo '=== WispHub invoice 9604 after attempt ==='
          cat > /tmp/check_invoice.php <<'PHP'
          <?php
          $base=$argv[1]; require $base.'/config_wisphub.php';
          $url=rtrim(WISPHUB_API_URL,'/').'/facturas/9604/';
          $ch=curl_init($url);curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_TIMEOUT=>20,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,CURLOPT_HTTPHEADER=>['Authorization: Api-Key '.WISPHUB_TOKEN,'Accept: application/json']]);
          $raw=curl_exec($ch);$code=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);curl_close($ch);$d=json_decode((string)$raw,true);
          echo "invoice_http=$code\n";
          if(is_array($d)) echo 'invoice_state='.json_encode(['id'=>$d['id_factura']??$d['id']??'','estado'=>$d['estado']??'','total'=>$d['total']??'','total_cobrado'=>$d['total_cobrado']??'','fecha_pago'=>$d['fecha_pago']??null],JSON_UNESCAPED_SLASHES)."\n";
          PHP
          php /tmp/check_invoice.php "$BASE"
          rm -f /tmp/check_invoice.php
          REMOTE
