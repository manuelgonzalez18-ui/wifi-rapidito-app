name: Deploy Promise Proxy

on:
  push:
    branches: [main]
    paths:
      - 'public/proxy_promises.php'
      - '.github/workflows/deploy-promise-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rapidito-promise-proxy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: php -l public/proxy_promises.php

      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST" && test -n "$HOSTINGER_USER" && test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_promise
          chmod 600 ~/.ssh/hostinger_promise
          ssh-keygen -y -f ~/.ssh/hostinger_promise >/dev/null
          : > ~/.ssh/known_hosts
          connected=0
          for attempt in {1..6}; do
            echo "Hostinger SSH attempt $attempt/6..."
            if ssh-keyscan -T 10 -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null && \
               ssh -i ~/.ssh/hostinger_promise -p 65002 -o BatchMode=yes -o ConnectTimeout=20 \
                 "$HOSTINGER_USER@$HOSTINGER_HOST" 'echo "Hostinger SSH connection verified."'; then
              connected=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$connected" = 1

      - name: Deploy promise proxy atomically
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="/home/$HOSTINGER_USER/domains/wifirapidito.com/public_html"
          scp -i ~/.ssh/hostinger_promise -P 65002 public/proxy_promises.php \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/proxy_promises.php.next"
          ssh -i ~/.ssh/hostinger_promise -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "php -l '$REMOTE_BASE/proxy_promises.php.next' >/dev/null && cp '$REMOTE_BASE/proxy_promises.php' '$REMOTE_BASE/proxy_promises.php.bak' 2>/dev/null || true; php -l '$REMOTE_BASE/proxy_promises.php.next' >/dev/null && mv '$REMOTE_BASE/proxy_promises.php.next' '$REMOTE_BASE/proxy_promises.php'"

      - name: Verify public promise proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            BODY="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/proxy_promises.php?health=$GITHUB_SHA" 2>/dev/null || true)"
            if grep -q '3.2-promise-api-singular' <<<"$BODY"; then
              echo "Promise proxy deployment verified."
              exit 0
            fi
            echo "Waiting for public promise proxy propagation ($attempt/12)..."
            sleep 5
          done
          echo "Promise proxy public verification failed."
          exit 1

      - name: Publish deployment status
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Promise Proxy Deploy',
              description: 'Promise proxy deployed and publicly verified',
            });
