name: Bot Server Diagnostics

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-server-diagnostics.yml'
      - 'vps/LIVE_SERVER_DIAGNOSTICS_TRIGGER'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          BOT_VPS_HOST: ${{ secrets.BOT_VPS_HOST }}
          BOT_VPS_PORT: ${{ secrets.BOT_VPS_PORT }}
          BOT_VPS_USER: ${{ secrets.BOT_VPS_USER }}
          BOT_VPS_SSH_KEY: ${{ secrets.BOT_VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_VPS_HOST"
          test -n "$BOT_VPS_PORT"
          test -n "$BOT_VPS_USER"
          test -n "$BOT_VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$BOT_VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/rapidito
          chmod 600 ~/.ssh/rapidito
          ssh-keygen -y -f ~/.ssh/rapidito >/dev/null
          ssh-keyscan -p "$BOT_VPS_PORT" "$BOT_VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect Rapidito production read-only
        env:
          BOT_VPS_HOST: ${{ secrets.BOT_VPS_HOST }}
          BOT_VPS_PORT: ${{ secrets.BOT_VPS_PORT }}
          BOT_VPS_USER: ${{ secrets.BOT_VPS_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rapidito -p "$BOT_VPS_PORT" -o BatchMode=yes -o ConnectTimeout=10 "$BOT_VPS_USER@$BOT_VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/home/bot.local/public_html
          cd "$APP"
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"
          test -f docker-compose.yml
          test -f .env
          test -f bot_logic.py
          echo 'APP_LAYOUT_OK=1'
          docker --version
          docker compose version
          docker compose ps
          docker ps --format 'NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}'
          echo '--- BOT HEALTH ---'
          curl -fsS --max-time 5 http://127.0.0.1:5000/webhook || true
          echo
          echo '--- EVOLUTION ROOT ---'
          curl -fsS --max-time 5 http://127.0.0.1:8080/ || true
          echo
          set -a
          source .env
          set +a
          [[ -n "${EVO_API_KEY:-}" ]] && echo 'EVO_API_KEY=SET' || echo 'EVO_API_KEY=MISSING'
          [[ -n "${WISPHUB_API_KEY:-}" ]] && echo 'WISPHUB_API_KEY=SET' || echo 'WISPHUB_API_KEY=MISSING'
          echo "INSTANCE_NAME=${INSTANCE_NAME:-rapidito_bot}"
          if [[ -n "${EVO_API_KEY:-}" ]]; then
            code=$(curl -sS --max-time 8 -o /tmp/rapidito_instances.json -w '%{http_code}' -H "apikey: $EVO_API_KEY" http://127.0.0.1:8080/instance/fetchInstances || true)
            echo "EVOLUTION_INSTANCES_HTTP=$code"
            if [[ "$code" == "200" ]]; then
              grep -o '"instanceName"[^,}]*\|"state"[^,}]*\|"connectionStatus"[^,}]*' /tmp/rapidito_instances.json | head -30 || true
            fi
          fi
          REMOTE
