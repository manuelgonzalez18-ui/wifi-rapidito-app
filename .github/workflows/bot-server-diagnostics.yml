name: Bot Server Diagnostics

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/bot-server-diagnostics.yml'
      - 'vps/LIVE_SERVER_DIAGNOSTICS_TRIGGER'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe known server endpoints without changes
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy

          hosts=("193.203.188.215")
          if [[ -n "${HOSTINGER_HOST:-}" && "$HOSTINGER_HOST" != "193.203.188.215" ]]; then hosts+=("$HOSTINGER_HOST"); fi
          host_index=0
          found=0
          for host in "${hosts[@]}"; do
            host_index=$((host_index+1))
            users=("$HOSTINGER_USER")
            [[ $host_index -eq 1 ]] && users+=(root ubuntu debian)
            for user in "${users[@]}"; do
              for port in 22 65002; do
                SSH=(ssh -i ~/.ssh/hostinger_deploy -p "$port" -o BatchMode=yes -o ConnectTimeout=4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
                if ! timeout 7 "${SSH[@]}" "$user@$host" 'true' >/dev/null 2>&1; then continue; fi
                found=1
                echo "REACHABLE host=$host_index user=$user port=$port"
                "${SSH[@]}" "$user@$host" "set +e; for c in python3 pip3 node npm npx pm2 screen tmux git curl; do command -v \$c >/dev/null 2>&1; rc=\$?; echo CMD_\$(echo \$c | tr a-z A-Z)=\$rc; done; python3 --version 2>/dev/null | sed 's/^/PYTHON_VERSION=/' || true; node --version 2>/dev/null | sed 's/^/NODE_VERSION=/' || true; npm --version 2>/dev/null | sed 's/^/NPM_VERSION=/' || true; command -v docker >/dev/null 2>&1; echo HAS_DOCKER=\$?; test -x /usr/bin/docker; echo USR_BIN_DOCKER=\$?; test -S /var/run/docker.sock; echo DOCKER_SOCKET=\$?; sudo -n true >/dev/null 2>&1; echo PASSWORDLESS_SUDO=\$?; sudo -n docker --version >/dev/null 2>&1; echo SUDO_DOCKER=\$?; curl -fsS --max-time 2 http://127.0.0.1:5000/webhook >/dev/null 2>&1; echo LOCAL_5000_WEBHOOK=\$?; curl -fsS --max-time 2 http://127.0.0.1:8080 >/dev/null 2>&1; echo LOCAL_8080=\$?; count=\$(find \"\$HOME\" /opt /srv /root -maxdepth 8 -type f \( -name bot_logic.py -o -name bot_presentation.py \) 2>/dev/null | wc -l | tr -d ' '); echo BOT_FILES_COUNT=\$count; compose_count=\$(find \"\$HOME\" /opt /srv /root -maxdepth 8 -type f \( -name docker-compose.yml -o -name compose.yml \) 2>/dev/null | xargs -r grep -l 'bot_backend:' 2>/dev/null | wc -l | tr -d ' '); echo BOT_COMPOSE_COUNT=\$compose_count"
              done
            done
          done
          test "$found" -eq 1
