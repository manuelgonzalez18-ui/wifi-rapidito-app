name: Promise Restrictions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'public/promise_restrictions.php'
      - 'public/promise_restrictions_lib.php'
      - 'public/proxy_promises.php'
      - 'vps/bot_logic.py'
      - '.github/workflows/promise-restrictions-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/promise_restrictions.php'
      - 'public/promise_restrictions_lib.php'
      - 'public/proxy_promises.php'
      - 'vps/bot_logic.py'
      - '.github/workflows/promise-restrictions-deploy.yml'

permissions:
  contents: read
  statuses: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backend syntax
        run: |
          php -l public/promise_restrictions_lib.php
          php -l public/promise_restrictions.php
          php -l public/proxy_promises.php
          python -m py_compile vps/bot_logic.py

      - name: Configure Hostinger SSH
        if: github.event_name == 'push'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy >/dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts

      - name: Configure bot VPS SSH
        if: github.event_name == 'push'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST secret"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing VPS_USER secret"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY secret"; exit 1; }
          VPS_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy
          ssh-keygen -y -f ~/.ssh/vps_deploy >/dev/null
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Backup and deploy restriction backend
        if: github.event_name == 'push'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="/home/$HOSTINGER_USER/domains/wifirapidito.com/public_html"
          stamp="$(date +%Y%m%d-%H%M%S)"

          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mkdir -p '$REMOTE_BASE/.portal-backups' && cd '$REMOTE_BASE' && tar -czf '.portal-backups/promise-backend-$stamp.tar.gz' --ignore-failed-read proxy_promises.php promise_restrictions.php promise_restrictions_lib.php 2>/dev/null || true"

          for file in promise_restrictions_lib.php promise_restrictions.php proxy_promises.php; do
            scp -i ~/.ssh/hostinger_deploy -P 65002 \
              "public/$file" \
              "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_BASE/$file.next"
            ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
              "php -l '$REMOTE_BASE/$file.next' >/dev/null && mv '$REMOTE_BASE/$file.next' '$REMOTE_BASE/$file'"
          done

          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "find '$REMOTE_BASE/.portal-backups' -type f -name 'promise-backend-*.tar.gz' -mtime +14 -delete || true"

      - name: Deploy and restart Rapidito bot on VPS
        if: github.event_name == 'push'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          remote_tmp="/tmp/wifi-rapidito-bot_logic.py.$GITHUB_SHA"

          scp -i ~/.ssh/vps_deploy -P "$VPS_PORT" \
            vps/bot_logic.py \
            "$VPS_USER@$VPS_HOST:$remote_tmp"

          ssh -i ~/.ssh/vps_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "REMOTE_TMP='$remote_tmp' bash -s" <<'REMOTE'
          set -euo pipefail

          compose_file=""
          for base in "$HOME" /opt /srv; do
            [ -d "$base" ] || continue
            while IFS= read -r candidate; do
              if grep -q 'container_name:[[:space:]]*bot_backend' "$candidate" 2>/dev/null; then
                compose_file="$candidate"
                break 2
              fi
            done < <(find "$base" -maxdepth 6 -type f \( -name docker-compose.yml -o -name compose.yml \) 2>/dev/null)
          done

          if [ -z "$compose_file" ]; then
            echo "Could not locate the Rapidito bot docker compose project on the VPS."
            rm -f "$REMOTE_TMP"
            exit 1
          fi

          app_dir="$(dirname "$compose_file")"
          target="$app_dir/bot_logic.py"
          backup="$app_dir/.bot_logic.py.$(date +%Y%m%d-%H%M%S).bak"

          if [ -f "$target" ]; then
            cp "$target" "$backup"
          fi
          cp "$REMOTE_TMP" "$target.next"
          python3 -m py_compile "$target.next"
          mv "$target.next" "$target"
          rm -f "$REMOTE_TMP"

          cd "$app_dir"
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d --build bot_backend
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose up -d --build bot_backend
          else
            echo "Docker Compose is not available on the VPS."
            exit 1
          fi

          for attempt in $(seq 1 20); do
            if docker inspect -f '{{.State.Running}}' bot_backend 2>/dev/null | grep -qx true \
              && docker exec bot_backend grep -q 'Podrás solicitar nuevamente una Promesa de Pago a partir' /app/bot_logic.py 2>/dev/null; then
              echo "Rapidito bot deployed, restarted and verified."
              exit 0
            fi
            sleep 3
          done

          echo "Rapidito bot verification failed after restart."
          docker logs --tail 80 bot_backend 2>&1 || true
          exit 1
          REMOTE

      - name: Verify public backend
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            RESTRICTIONS="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/promise_restrictions.php?health=$GITHUB_SHA" 2>/dev/null || true)"
            PROMISES="$(curl -fsS -H 'Cache-Control: no-cache' "https://wifirapidito.com/proxy_promises.php?health=$GITHUB_SHA" 2>/dev/null || true)"
            if grep -q '1.2-auto-breach-restrictions' <<<"$RESTRICTIONS" \
              && grep -q '3.0-restriction-enforcement' <<<"$PROMISES"; then
              echo 'Promise restriction backend verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Promise restriction backend public verification failed.'
          exit 1

      - name: Publish deployment status
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Promise Restrictions Deploy',
              description: 'Promise backend and Rapidito bot deployed and verified',
            });
