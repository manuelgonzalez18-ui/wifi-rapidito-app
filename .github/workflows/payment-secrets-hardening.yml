name: Payment Secrets Hardening

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/payment-secrets-hardening.yml'

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy >/dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts

      - name: Move payment credentials outside public_html
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domains/wifirapidito.com/public_html"
          PRIVATE="$HOME/domains/wifirapidito.com/.wifi-rapidito-private"
          CONFIG="$BASE/config_wisphub.php"
          BANESCO="$BASE/banesco_api.php"
          SECRETS="$PRIVATE/payment_secrets.php"
          STAMP="$(date +%Y%m%d-%H%M%S)"

          test -s "$CONFIG"
          test -s "$BANESCO"
          mkdir -p "$PRIVATE"
          chmod 700 "$PRIVATE"
          cp "$CONFIG" "$PRIVATE/config_wisphub.php.$STAMP.bak"
          cp "$BANESCO" "$PRIVATE/banesco_api.php.$STAMP.bak"

          php -r '
            $config=$argv[1]; $banesco=$argv[2]; $out=$argv[3];
            require $config;
            $token=defined("WISPHUB_TOKEN")?(string)WISPHUB_TOKEN:"";
            $src=file_get_contents($banesco);
            if ($token==="" || !is_string($src)) { fwrite(STDERR,"missing current credentials\n"); exit(2); }
            if (!preg_match("/define\\(\\x27BANESCO_CLIENT_ID\\x27,\\s*\\x27([^\\x27]+)\\x27\\);/",$src,$m1)) { fwrite(STDERR,"missing Banesco client id\n"); exit(3); }
            if (!preg_match("/define\\(\\x27BANESCO_CLIENT_SECRET\\x27,\\s*\\x27([^\\x27]+)\\x27\\);/",$src,$m2)) { fwrite(STDERR,"missing Banesco client secret\n"); exit(4); }
            $php="<?php\n"
              ."define(\x27WISPHUB_PRIVATE_TOKEN\x27, ".var_export($token,true).");\n"
              ."define(\x27BANESCO_PRIVATE_CLIENT_ID\x27, ".var_export($m1[1],true).");\n"
              ."define(\x27BANESCO_PRIVATE_CLIENT_SECRET\x27, ".var_export($m2[1],true).");\n";
            if (file_put_contents($out,$php,LOCK_EX)===false) exit(5);
          ' "$CONFIG" "$BANESCO" "$SECRETS"
          chmod 600 "$SECRETS"

          cat > "$CONFIG" <<'PHP'
          <?php
          $privateConfig = dirname(__DIR__) . '/.wifi-rapidito-private/payment_secrets.php';
          if (!is_file($privateConfig)) {
              throw new RuntimeException('Configuración privada WispHub no disponible.');
          }
          require_once $privateConfig;
          if (!defined('WISPHUB_PRIVATE_TOKEN') || WISPHUB_PRIVATE_TOKEN === '') {
              throw new RuntimeException('WISPHUB_TOKEN no está configurado.');
          }
          define('WISPHUB_TOKEN', WISPHUB_PRIVATE_TOKEN);
          define('WISPHUB_API_URL', 'https://api.wisphub.app/api/');
          define('WISPHUB_STAFF_USER', 'admin@wifi-rapidito');
          ?>
          PHP

          php -r '
            $p=$argv[1];
            $src=file_get_contents($p);
            if (!is_string($src)) exit(2);
            $loader="require_once dirname(__DIR__) . \x27/.wifi-rapidito-private/payment_secrets.php\x27;\n";
            if (strpos($src,"payment_secrets.php")===false) {
              $src=preg_replace("/<\\?php\\s*/", "<?php\n".$loader, $src, 1);
            }
            $src=preg_replace("/define\\(\\x27BANESCO_CLIENT_ID\\x27,\\s*\\x27[^\\x27]*\\x27\\);/", "define(\x27BANESCO_CLIENT_ID\x27, BANESCO_PRIVATE_CLIENT_ID);", $src, 1);
            $src=preg_replace("/define\\(\\x27BANESCO_CLIENT_SECRET\\x27,\\s*\\x27[^\\x27]*\\x27\\);/", "define(\x27BANESCO_CLIENT_SECRET\x27, BANESCO_PRIVATE_CLIENT_SECRET);", $src, 1);
            if (strpos($src,"BANESCO_PRIVATE_CLIENT_ID")===false || strpos($src,"BANESCO_PRIVATE_CLIENT_SECRET")===false) exit(3);
            if (file_put_contents($p,$src,LOCK_EX)===false) exit(4);
          ' "$BANESCO"

          php -l "$CONFIG" >/dev/null
          php -l "$BANESCO" >/dev/null
          php -r 'require $argv[1]; if (!defined("WISPHUB_TOKEN") || WISPHUB_TOKEN==="") exit(2); echo "wisphub_config=ok\n";' "$CONFIG"
          php -r 'require $argv[1]; if (!defined("BANESCO_CLIENT_ID") || !defined("BANESCO_CLIENT_SECRET")) exit(2); echo "banesco_config=ok\n";' "$BANESCO"

          if grep -Eq "define\('WISPHUB_TOKEN',[[:space:]]*'|define\('BANESCO_CLIENT_SECRET',[[:space:]]*'" "$CONFIG" "$BANESCO"; then
            echo 'public_literal_secret=present'
            exit 6
          fi
          echo 'public_literal_secret=absent'
          echo 'payment_secret_hardening=ok'
          REMOTE
