name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, reconstruccion-bot-10-opciones]

permissions:
  contents: read
  statuses: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  APK_VERSION: 6.0.3
  APK_FILENAME: Wifi-Rapidito-6.0.3.apk
  LEGACY_APK_FILENAME: Wifi-Rapidito-6.0.2.apk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify promise restriction logic is included
        shell: bash
        run: |
          set -euo pipefail
          grep -q "promise_restrictions.php" src/pages/Client/PromiseGate.jsx
          grep -q "<PromiseGate><RequestPromise /></PromiseGate>" src/App.jsx
          grep -q "versionCode 603" android/app/build.gradle
          grep -q 'versionName "6.0.3"' android/app/build.gradle

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web frontend
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_FILENAME"
          test -s "$APK_FILENAME"
          echo "Built $APK_FILENAME ($(du -h "$APK_FILENAME" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-rapidito-android-${{ github.sha }}
          path: ${{ env.APK_FILENAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Configure Hostinger SSH
        if: github.event_name == 'push'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy > /dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hostinger_deploy -p 65002 -o BatchMode=yes -o ConnectTimeout=15 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'echo "Hostinger SSH connection verified for APK deploy."'

      - name: Deploy APK to Hostinger
        if: github.event_name == 'push'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="/home/$HOSTINGER_USER/domains/wifirapidito.com/public_html"
          REMOTE_NEXT="$REMOTE_BASE/$APK_FILENAME.next"
          REMOTE_VERSIONED="$REMOTE_BASE/$APK_FILENAME"
          REMOTE_LEGACY="$REMOTE_BASE/$LEGACY_APK_FILENAME"
          REMOTE_STABLE="$REMOTE_BASE/Wifi-Rapidito.apk"

          scp -i ~/.ssh/hostinger_deploy -P 65002 \
            "$APK_FILENAME" \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_NEXT"

          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "test -s '$REMOTE_NEXT' && mv '$REMOTE_NEXT' '$REMOTE_VERSIONED' && cp '$REMOTE_VERSIONED' '$REMOTE_LEGACY' && cp '$REMOTE_VERSIONED' '$REMOTE_STABLE' && test -s '$REMOTE_VERSIONED' && test -s '$REMOTE_LEGACY' && test -s '$REMOTE_STABLE'"

      - name: Verify public APK aliases
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for FILE in "$APK_FILENAME" "$LEGACY_APK_FILENAME" "Wifi-Rapidito.apk"; do
            URL="https://wifirapidito.com/$FILE?sha=$GITHUB_SHA"
            verified=0
            for attempt in {1..12}; do
              rm -f apk-head.bin
              if curl -fsS --range 0-3 "$URL" -o apk-head.bin; then
                SIGNATURE="$(head -c 4 apk-head.bin | xxd -p)"
                if [[ "$SIGNATURE" == "504b0304" ]]; then
                  verified=1
                  break
                fi
              fi
              sleep 5
            done
            test "$verified" = 1
            echo "Public APK verified: $FILE"
          done

      - name: Publish Android APK deployment status
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Android APK Deploy',
              description: 'APK 6.0.3 built with promise restriction logic and published',
            });
