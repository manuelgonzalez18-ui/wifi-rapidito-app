name: Promise Ledger Sweep

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile overdue promises
        env:
          PROMISE_RECONCILE_TOKEN: ${{ secrets.PROMISE_RECONCILE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROMISE_RECONCILE_TOKEN"
          RESPONSE="$(curl -fsS --retry 3 --retry-delay 5 --get             --data-urlencode "action=reconcile"             --data-urlencode "limit=250"             --data-urlencode "token=$PROMISE_RECONCILE_TOKEN"             "https://wifirapidito.com/promise_restrictions.php")"
          echo "$RESPONSE"
          grep -q '"success":true' <<<"$RESPONSE"
