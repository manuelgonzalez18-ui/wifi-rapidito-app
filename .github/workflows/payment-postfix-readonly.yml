name: Payment Postfix Readonly

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/payment-postfix-readonly.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keygen -y -f ~/.ssh/hostinger_deploy >/dev/null
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts

      - name: Capture safe live adapter structure without changes
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_deploy -p 65002 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ADAPTER="$HOME/domains/wifirapidito.com/public_html/banesco_api.php"
          test -s "$ADAPTER"
          php -l "$ADAPTER" >/dev/null
          echo '=== safe header structure ==='
          grep -nE 'BANESCO_(ENV|SSO|API_URL|TOKEN_CACHE)|payment_secrets|class BanescoAPI|function (logDebug|getToken|checkTransaction)' "$ADAPTER" | sed -E "s/(CLIENT_SECRET|CLIENT_ID)[^;]*/\1=REDACTED/g" || true
          echo '=== validation tail ==='
          sed -n '220,360p' "$ADAPTER" | sed -E "s/[A-Fa-f0-9]{24,}/REDACTED/g"
          REMOTE
