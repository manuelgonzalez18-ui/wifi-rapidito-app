EOF
          scp -i ~/.ssh/hostinger -P 65002 /tmp/promise_breaches.tsv "$HOSTINGER_USER@$HOSTINGER_HOST:/tmp/promise_breaches.tsv"
          ssh -i ~/.ssh/hostinger -p 65002 -o BatchMode=yes "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/wifirapidito.com/public_html"
          cd "$APP"
          php <<'PHP'
<?php
require "promise_restrictions_lib.php";
require "config_wisphub.php";

$lines = file("/tmp/promise_breaches.tsv", FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
$records = pr_load_records();

function fetch_client_by_username(string $username): ?array {
    $offset=0; $limit=300;
    for($page=0;$page<40;$page++){
        $url=rtrim(WISPHUB_API_URL,"/")."/clientes/?limit=$limit&offset=$offset";
        $ch=curl_init($url);
        curl_setopt_array($ch,[
            CURLOPT_RETURNTRANSFER=>true,
            CURLOPT_HTTPHEADER=>["Authorization: Api-Key ".WISPHUB_TOKEN,"Accept: application/json"],
            CURLOPT_CONNECTTIMEOUT=>5,
            CURLOPT_TIMEOUT=>20
        ]);
        $body=curl_exec($ch);
        $code=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);
        curl_close($ch);
        if($body===false || $code<200 || $code>=300) return null;
        $d=json_decode($body,true);
        $batch=is_array($d["results"]??null)?$d["results"]:(is_array($d)&&array_is_list($d)?$d:[]);
        foreach($batch as $c){
            if(!is_array($c)) continue;
            $u=pr_normalize_username(pr_first_value($c,["usuario","usuario_portal","username"],""));
            if($u===$username) return $c;
        }
        $n=count($batch);
        if($n===0) break;
        $offset += $n;
        $total=isset($d["count"])&&is_numeric($d["count"])?(int)$d["count"]:null;
        if($total!==null && $offset >= $total) break;
        if($total===null && $n<$limit && empty($d["next"])) break;
    }
    return null;
}

$created=0; $skipped=0; $errors=0;
foreach($lines as $line){
    [$username,$incident,$msgid]=array_pad(explode("\t",$line),3,"");
    $username=pr_normalize_username($username);
    $source="gmail:".$msgid;

    $duplicate=false;
    foreach($records as $r){
        if(($r["source_event_id"]??"")===$source || ($r["source_message_id"]??"")===$msgid){
            $duplicate=true; break;
        }
    }
    if($duplicate){
        echo "SKIP_DUPLICATE $username\n";
        $skipped++;
        continue;
    }

    $found=fetch_client_by_username($username);
    if(!$found){
        echo "ERROR_CLIENT_NOT_FOUND $username\n";
        $errors++;
        continue;
    }

    $ids=pr_identifiers_from_client($found);
    $existingActive=false;
    foreach($records as $existing){
        if(pr_record_is_active($existing) && pr_records_match($existing,$ids)){
            $existingActive=true; break;
        }
    }
    if($existingActive){
        echo "SKIP_ACTIVE $username\n";
        $skipped++;
        continue;
    }

    $date=DateTimeImmutable::createFromFormat("!Y-m-d",$incident);
    if(!$date){
        echo "ERROR_DATE $username\n";
        $errors++;
        continue;
    }
    $ends=pr_add_months_clamped($date,3)->setTime(0,0,0);
    $clientName=trim((string)pr_first_value($found,["nombre","nombre_cliente","name","cliente"],$username));
    $record=[
        "id"=>bin2hex(random_bytes(8)),
        "client_name"=>$clientName,
        "service_id"=>$ids["service_id"],
        "client_id"=>$ids["client_id"],
        "username"=>$ids["username"],
        "phone"=>$ids["phone"],
        "cedula"=>trim((string)pr_first_value($found,["cedula","documento","rif"],"")),
        "email"=>trim((string)pr_first_value($found,["correo","email"],"")),
        "reason"=>"Incumplimiento de promesa de pago",
        "note"=>"Restricción automática recuperada desde notificación confirmada de WispHub.",
        "incident_date"=>$incident,
        "starts_at"=>$date->setTime(0,0,0)->format(DATE_ATOM),
        "ends_at"=>$ends->format(DATE_ATOM),
        "created_at"=>date(DATE_ATOM),
        "created_by"=>"wisphub-breach-backfill",
        "source"=>"gmail-wisphub",
        "source_event_id"=>$source,
        "source_message_id"=>$msgid,
        "revoked_at"=>null,
        "revoked_by"=>null
    ];
    $records[]=$record;
    $created++;
    echo "CREATED $username UNTIL ".$ends->format("Y-m-d")."\n";
}
if(!pr_save_records($records)){
    fwrite(STDERR,"Save failed\n");
    exit(5);
}
echo "SUMMARY CREATED=$created SKIPPED=$skipped ERRORS=$errors\n";
PHP
          REMOTE
