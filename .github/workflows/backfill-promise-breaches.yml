name: Backfill Promise Breaches

on:
  push:
    branches: [reconstruccion-bot-10-opciones]
    paths:
      - '.github/workflows/backfill-promise-breaches.yml'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure Hostinger SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST" && test -n "$HOSTINGER_USER" && test -n "$HOSTINGER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p 65002 -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply missing three-month restrictions
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/promise_breaches.tsv <<'EOF'
oscarmartinez	2026-09-04	1a06ac9f187f760a
dargenisaponte	2026-09-04	1a06ac9edee990e4
celestemejias	2026-09-04	1a06ac9ecef763d8
zuleikaaguilar	2026-09-04	1a06ac9ecb2c3ae2
leidycartagena	2026-09-03	1a065a38e9a4a350
soniasan	2026-09-02	1a06514b644aad3e
elizabethmartinez	2026-09-01	1a05e8de1f95c873
angelicacartagena	2026-09-01	1a05b56db1af1f45
franksanz	2026-08-31	1a05ae81a4ae1b03
mariatorres	2026-08-31	1a05adfdab470e73
carolinazapata	2026-08-31	1a05addf4e589183
barbarasanz	2026-08-31	1a05ad6a92229bd1
ivonnerivero	2026-08-31	1a05ac7fcfba98f3
mercedestorres	2026-08-31	1a05ac281b2b1402
virginialiendo	2026-08-31	1a05ab86d3a01a45
mirlaacevedo	2026-08-31	1a0563086a06f42a
yulimar	2026-08-31	1a0563083c310411
yaneisypalacios	2026-08-31	1a05630832fee22c
hosmelisrodriguez	2026-08-31	1a0563081896af41
maurelismata	2026-08-31	1a0563080dd64ea5
davilsapalacios	2026-08-30	1a0559d0e5972ad3
jackelinediaz	2026-08-30	1a0510a22bdb8eb6
oliverruiz	2026-08-30	1a0510a210d7188d
cristicurvelo	2026-08-30	1a0510a1ef0616bf
luisblanco	2026-08-29	1a05095ce92ec738
belkistorres	2026-08-29	1a050931529d4f1b
